<script>
/* ================================================================
   ████  CONFIG — a loja e as comissoes  ████
   Esta pagina e o sitio onde se vende: o merch e as comissoes. Tudo o
   que so ela usa vive AQUI e em mais lado nenhum (os produtos, os
   textos da loja, o email-modelo do pedido de comissao).
   Os campos que o index.html TAMBEM le tem de ser iguais nos dois
   ficheiros — o tools/verify.mjs falha se nao forem:
     artistName, realName, email, instagram, shop, commissionsOpen,
     tiers, shopOpen, e nos textos commTitle, commOpen, commClosed,
     commIntro, navShop, navComm e tiers.
   ================================================================ */
const CONFIG = {

  /* ---------- IDENTIDADE ---------- */
  artistName: "Guita_Ink",
  realName: "Frederico Guita",
  email: "frederico@guitaink.com",
  instagram: "https://www.instagram.com/guita_ink",
  shop: "https://xqms3c-zk.myshopify.com",              // Shopify: so o checkout

  /* ---------- COMISSOES ----------
     §9.4: aqui ficam os QUATRO FORMATOS e mais nada. Nenhum preco, nenhuma
     fase, nenhum prazo, nenhum link para a loja. O numero vai por email,
     com o PDF. Os precos vivem em dois sitios, e so dois:
        1. o produto no Shopify        2. Guita_Ink_Comissoes_PT.pdf (Drive)
     O `handle` fica porque e ele que da o link da loja no email de aceitacao.
     Fechar comissoes continua a ser DOIS gestos: commissionsOpen:false aqui E
     no index.html, e os produtos do Shopify em rascunho. */
  commissionsOpen: true,
  tiers: [
    { key: "headshot", handle: "commission-headshot-bust" },
    { key: "half",     handle: "commission-half-body" },
    { key: "full",     handle: "commission-full-body" },
    { key: "sheet",    handle: "commission-character-sheet" },
  ],

  /* ---------- MERCH ----------
     ⚠️ LANCAMENTO: shopOpen:false esconde a seccao merch desta pagina E o
        link "Loja" do menu do index. Ate la esta pagina so mostra as
        comissoes. No dia do lancamento sao TRES gestos, e a ordem importa:
        1. no Shopify, os produtos Merch a Activo E publicados na "Loja online"
        2. no Shopify, a coleccao "Merch — Guita_Ink" publicada na "Loja online"
        3. shopOpen:true AQUI E no index.html — por ultimo, com 1 e 2 feitos.
           O verify.mjs falha se os dois ficheiros nao disserem o mesmo.
        ACTIVO NAO E PUBLICADO. Os quatro produtos de comissao estiveram Activos
        durante dois meses e ninguem os conseguia abrir, porque nunca tinham
        sido publicados na Loja online. Confirma nos dois sitios: estado
        "Activo" E o canal "Loja online" marcado, na ficha de cada produto.
        Fechar e o inverso, pela ordem contraria — senao as pessoas caem numa
        coleccao vazia.
     handle: deixa "" para o cartao ir para a coleccao Merch; preenche com o
        handle do produto Shopify quando o produto tiver o nome definitivo.
     src: foto do produto, opcional. Vazio → placa tipografica.
     NOTA: ao contrario das comissoes, estes precos estao na pagina. Uma
        comissao e orcamento e o numero vai por email (§9.4); um print a 18€ e
        preco de prateleira. Se alguma vez puseres um src aqui, lembra-te do
        §9.1: fan art nao se vende, nem como print nem como autocolante. */
  shopOpen: false,
  shopDrop: "Drop 01",
  merchCollection: "merch-guita_ink",
  merch: [                                              // sincronizado com o Shopify, 20 Set 2026
    { key: "print",   price: "18", unit: "€", from: true,  handle: "", plate: "版" },
    { key: "limited", price: "45", unit: "€", from: false, handle: "", plate: "限" },
    { key: "sticker", price: "4",  unit: "€", from: true,  handle: "", plate: "貼" },
    { key: "acrylic", price: "12", unit: "€", from: false, handle: "", plate: "鍵", preorder: true },
  ],

  /* ---------- TEXTOS (EN / PT) ---------- */
  i18n: {
    en: {
      navShop: "Shop", navComm: "Commissions",
      backHome: "Portfolio",
      shopJump: "Merch", commJump: "Commissions",
      commTitle: "Commissions",
      commOpen: "Open", commClosed: "Closed",
      commIntro: "Four formats, from a bust to a full character sheet. Tell me what you have in mind and I reply with the format, the price and the timeline.",
      commNote: "Prices and the full process go by email, with a short guide of how we work together.",
      tiers: {
        headshot: { name: "Headshot / Bust", desc: "Head and shoulders, fully rendered." },
        half:     { name: "Half body",       desc: "Waist-up illustration, fully rendered." },
        full:     { name: "Full body",       desc: "Complete character, fully rendered." },
        sheet:    { name: "Character sheet", desc: "Turnarounds, expressions and detail callouts. Final quote depends on the number of views." },
      },
      commCta: "Ask about a commission",
      shopTitle: "Shop",
      merchTitle: "Merch",
      shopIntro: "Prints, stickers and small things made from original Guita_Ink art. Released in drops. When it's gone, it's gone.",
      shopAll: "See the whole shop",
      shopPreorder: "Pre-order",
      fromPrefix: "From",
      merchItems: {
        print:   { name: "Art print",       desc: "A4 or A3, heavyweight matte paper." },
        limited: { name: "Limited edition", desc: "A3, signed and numbered. 50 copies, never reprinted." },
        sticker: { name: "Stickers",        desc: "Die-cut vinyl, matte or holographic." },
        acrylic: { name: "Acrylic keychain", desc: "Double-sided clear acrylic. Made once the batch fills." },
      },
      mailSubject: "Commission request",
      mailBody: "Hi Frede,\n\n"
        + "Format (bust / half body / full body / character sheet): \n"
        + "Character: \n"
        + "Reference links: \n"
        + "Pose or framing you have in mind: \n"
        + "Colours or mood: \n"
        + "Any date you need it by: \n"
        + "Commercial use (yes / no): \n\n"
        + "Thanks,\n",
      questions: "Questions first? Write to",
    },
    pt: {
      navShop: "Loja", navComm: "Comissões",
      backHome: "Portefólio",
      shopJump: "Merch", commJump: "Comissões",
      commTitle: "Comissões",
      commOpen: "Abertas", commClosed: "Fechadas",
      commIntro: "Quatro formatos, do busto à character sheet completa. Diz-me o que tens em mente e respondo com o formato, o valor e o prazo.",
      commNote: "Os valores e o processo completo seguem por email, com um guia curto de como vamos trabalhar.",
      tiers: {
        headshot: { name: "Headshot / Busto",   desc: "Cabeça e ombros, totalmente renderizado." },
        half:     { name: "Meio corpo",         desc: "Ilustração da cintura para cima, totalmente renderizada." },
        full:     { name: "Corpo inteiro",      desc: "Personagem completa, totalmente renderizada." },
        sheet:    { name: "Character sheet",    desc: "Turnarounds, expressões e detalhes. Orçamento final depende do número de vistas." },
      },
      commCta: "Pedir uma comissão",
      shopTitle: "Loja",
      merchTitle: "Merch",
      shopIntro: "Prints, autocolantes e pequenas coisas feitas a partir da arte original Guita_Ink. Sai em drops. Quando esgota, esgota.",
      shopAll: "Ver a loja toda",
      shopPreorder: "Pré-venda",
      fromPrefix: "Desde",
      merchItems: {
        print:   { name: "Print",              desc: "A4 ou A3, papel mate de gramagem alta." },
        limited: { name: "Edição limitada",    desc: "A3, assinada e numerada. 50 exemplares, sem reimpressão." },
        sticker: { name: "Autocolantes",       desc: "Vinil recortado, mate ou holográfico." },
        acrylic: { name: "Porta-chaves acrílico", desc: "Acrílico transparente, dupla face. Produzido quando o lote fecha." },
      },
      mailSubject: "Pedido de comissão",
      mailBody: "Olá Frede,\n\n"
        + "Formato (busto / meio corpo / corpo inteiro / character sheet): \n"
        + "Personagem: \n"
        + "Links de referência: \n"
        + "Pose ou enquadramento que imaginas: \n"
        + "Cores ou ambiente: \n"
        + "Alguma data a cumprir: \n"
        + "Uso comercial (sim / não): \n\n"
        + "Obrigado,\n",
      questions: "Dúvidas antes? Escreve para",
    },
  },
};
</script>

<style>
/* ================= TOKENS — copia dos do index.html ================= */
:root{
  --void:#0A0A0A;         /* the field */
  --raise:#121212;        /* raised surface */
  --raise-2:#1A1A1A;
  --royal:#2E45FF;        /* Queen of Jacks blue */
  --royal-lift:#5568FF;   /* for small text on near-black */
  --royal-raise:#6B7BFF;  /* for small text on --raise */
  --bone:#F2F0EC;
  --bone-dim:#8C877F;
  --hair:rgba(242,240,236,.13);
  --f-disp:'Playfair Display',Georgia,serif;
  --f-body:'LT Museum','Lora',Georgia,serif;
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
}
[data-theme="light"]{
  --void:#F4F2ED;
  --raise:#FFFFFF;
  --raise-2:#EDEAE3;
  --royal:#2436C9;
  --royal-lift:#2436C9;
  --royal-raise:#2436C9;
  --bone:#141310;
  --bone-dim:#6B655C;
  --hair:rgba(20,19,16,.13);
}

*{margin:0;padding:0;box-sizing:border-box}
/* o atributo hidden tem de ganhar aos display:flex das classes daqui */
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body);background:var(--void);color:var(--bone);
  line-height:1.65;font-weight:300;-webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;overflow-x:hidden;
}
a{color:inherit}
::selection{background:var(--royal);color:#fff}
:focus-visible{outline:2px solid var(--royal-lift);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 26px;position:relative;z-index:1}
/* film grain — a mesma textura do index */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.16'/></svg>");
}
header,main,footer{position:relative;z-index:1}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
p{text-wrap:pretty}

/* ================= BARRA ================= */
header{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--void) 82%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);
}
.bar{display:flex;align-items:center;gap:18px;padding:10px 0;min-height:65px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
/* o selo e o logotipo: igual ao do index, sem animacao nenhuma aqui — o
   carimbo e a entrada do site, nao de cada pagina. */
.seal{
  width:30px;height:30px;flex:none;border-radius:8px;background:var(--royal);
  display:grid;place-items:center;font-family:var(--f-disp);font-size:.95rem;color:#fff;
}
.brand b{font-family:var(--f-disp);font-weight:500;font-size:1.1rem;letter-spacing:.01em}
.back{font-family:var(--f-ui);font-size:.8rem;color:var(--bone-dim);text-decoration:none;
  margin-left:auto;padding:12px 0;transition:color .2s ease}
.back:hover{color:var(--bone)}
.knobs{display:flex;gap:8px}
.knob{
  height:44px;min-width:44px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--hair);background:transparent;color:var(--bone-dim);
  /* o atalho font: define tambem a familia — um glifo sem ela cai no Arial */
  font:500 .68rem/1 var(--f-ui);letter-spacing:.1em;
  transition:border-color .2s ease,color .2s ease,transform .12s ease-out;
}
.knob:hover{border-color:var(--royal-lift);color:var(--bone)}

/* ================= CABECA DA PAGINA ================= */
.page-head{padding:clamp(48px,8vw,96px) 0 clamp(36px,5vw,56px);display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.kicker{font-family:var(--f-ui);font-size:.66rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;
  color:var(--bone-dim);display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:26px;height:1px;background:var(--royal-lift);flex:none}
/* uma linha reservada: o texto vem do JS e a caixa nao pode nascer com zero */
h1{font-size:clamp(2.4rem,7vw,4.6rem);text-transform:uppercase;letter-spacing:.06em;min-height:1.06em}
.jump{display:flex;gap:10px;flex-wrap:wrap}

/* ================= SECCOES ================= */
section{padding:clamp(48px,7vw,84px) 0;border-top:1px solid var(--hair)}
/* antes do lancamento as comissoes sao a pagina toda: seguem logo o titulo,
   sem o traco e o espaco de uma seccao nova, senao abria-se um buraco */
.so-comissoes #comissoes{border-top:0;padding-top:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem);text-transform:uppercase;letter-spacing:.10em;min-height:1.06em}
.lede{color:var(--bone-dim);max-width:36rem;font-size:1rem;margin-bottom:34px}
.badge{font-family:var(--f-ui);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
.badge.open{background:var(--royal);color:#fff}
.badge.closed{border:1px solid var(--hair);color:var(--bone-dim)}
.row{display:flex;gap:12px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;
  font:400 .86rem var(--f-ui);letter-spacing:.02em;padding:13px 26px;border-radius:2px;
  min-height:44px;border:1px solid var(--hair);color:var(--bone);background:transparent;
  transition:background .25s ease,border-color .25s ease,color .25s ease,transform .12s ease-out;
}
.btn:hover{border-color:var(--royal-lift)}
.btn.fill{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.fill:hover{background:transparent;color:var(--bone);border-color:var(--royal-lift)}

/* ---- merch: estes cartoes SAO links (vao ao produto ou a coleccao), por
   isso levam hover. Os das comissoes nao: sao so informacao. ---- */
.merch{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}
.merch-card{
  text-decoration:none;color:inherit;background:var(--raise);border:1px solid var(--hair);
  display:flex;flex-direction:column;transition:border-color .3s ease,transform .3s cubic-bezier(.2,.7,.3,1);
}
.merch-card:hover{border-color:var(--royal-lift);transform:translateY(-4px)}
.merch-card .art{position:relative;overflow:hidden;border-bottom:1px solid var(--hair)}
/* a placa ou, quando houver, a foto do produto: ocupa a largura do cartao.
   A etiqueta de pre-venda fica de fora, senao esticava de lado a lado. */
.merch-card .art > :not(.flag){width:100%;height:auto}
.plate{
  aspect-ratio:1/1;display:grid;place-items:center;background:var(--raise-2);position:relative;overflow:hidden;
}
.plate::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--royal) 1px,transparent 1.4px);background-size:16px 16px;opacity:.16}
.plate span{font-family:var(--f-disp);font-size:clamp(2.4rem,5vw,3.4rem);color:var(--royal-lift);z-index:1}
.merch-card .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.merch-card h3{font-size:1.1rem}
.merch-card p{font-size:.8rem;color:var(--bone-dim);flex:1}
/* --royal-raise e nao --royal-lift: o cartao e --raise, nao o fundo da pagina */
.price{font-family:var(--f-disp);color:var(--royal-raise);display:flex;align-items:baseline;gap:3px}
.price .from{font-family:var(--f-body);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin-right:5px}
.price .n{font-size:1.9rem;line-height:.9}
.price .u{font-size:.95rem}
.flag{
  position:absolute;top:12px;left:12px;z-index:2;font-family:var(--f-ui);font-size:.56rem;
  letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--royal);
  padding:3px 9px;border-radius:999px;
}

/* ---- comissoes: os quatro formatos. O primeiro (o mais acessivel) leva a
   celula maior para haver um ponto de entrada; linhas, nao caixas. ---- */
.tiers{display:grid;grid-template-columns:1.55fr 1fr 1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);margin-bottom:30px}
.tier{background:var(--void);padding:28px 22px;display:flex;flex-direction:column;gap:10px}
.tier:first-child{padding:28px 26px}
.tier:first-child h3{font-size:1.32rem}
.tier h3{font-size:1.15rem}
.tier p{font-size:.8rem;color:var(--bone-dim)}
.comm-note{font-family:var(--f-ui);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--bone-dim);margin:-14px 0 40px}
.ask{margin-top:26px;font-size:.9rem;color:var(--bone-dim)}
.ask a{color:var(--royal-lift);text-decoration:none;border-bottom:1px solid var(--hair);transition:border-color .2s ease}
.ask a:hover{border-color:var(--royal-lift)}

footer{font-family:var(--f-ui);
  padding:26px 0 46px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim)}
footer a{text-decoration:none;transition:color .2s ease}
footer a:hover{color:var(--bone)}

/* toda a coisa que se carrega responde ao toque */
.btn:active,.knob:active,.merch-card:active{transform:scale(.97)}

@media (max-width:980px){
  .merch{grid-template-columns:repeat(2,1fr)}
  .tiers{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){
  .merch{gap:12px}
  .merch-card .body{padding:14px}
  .merch-card h3{font-size:1rem}
  .merch-card p{font-size:.74rem}
  .price .n{font-size:1.5rem}
  .tiers{grid-template-columns:1fr}
  .brand b{display:none}          /* o selo chega; o nome nao cabe ao lado dos botoes */
}
/* §9.8 — sem efeitos nenhuns. A textura do grao fica: e parada. */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body,.knob,.btn,.back,.merch-card,.ask a,footer a{transition:none}
  .merch-card:hover,.btn:active,.knob:active,.merch-card:active{transform:none}
}
</style>
</head>

    <div class="merch" id="merchGrid"></div>
    <div class="row">
      <a class="btn fill" id="shopAll" href="#" target="_blank" rel="noopener"><span id="shopAllLabel"></span> ↗</a>
    </div>
  </section>

  <!-- COMISSOES — quatro formatos, sem precos (§9.4) -->
  <section id="comissoes">
    <div class="head" id="commHead">
      <h2 id="commTitle"></h2>
      <span class="badge" id="commBadge"></span>
    </div>
    <p class="lede" id="commIntro"></p>
    <div class="tiers" id="tiers"></div>
    <p class="comm-note" id="commNote"></p>
    <div class="row">
      <a class="btn fill" id="commCta" href="#"><span id="commCtaLabel"></span> →</a>
    </div>
    <p class="ask"><span id="askLabel"></span> <a id="askMail" href="#"></a></p>
  </section>

  <footer>
    <span id="footL"></span>
    <a id="footIg" href="#" target="_blank" rel="noopener">Instagram ↗</a>
  </footer>
</div>
</main>

<script>
const $ = s => document.querySelector(s);
/* A lingua: primeiro a que veio no link do index (?lang=pt), senao a do
   browser — a mesma regra do index. Assim quem mudou para PT la nao cai em
   EN aqui. */
const pedida = new URLSearchParams(location.search).get('lang');
let LANG = (pedida === 'pt' || pedida === 'en') ? pedida
  : ((navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en');
if(matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';

function render(){
  const t = CONFIG.i18n[LANG];
  const shopOn = !!CONFIG.shopOpen;
  const open = !!CONFIG.commissionsOpen;
  document.documentElement.lang = LANG;
  $('#langTgl').textContent = LANG === 'en' ? 'PT' : 'EN';
  /* o regresso ao portefolio leva a lingua consigo */
  const home = LANG === 'pt' ? 'index.html?lang=pt' : 'index.html';
  $('#brand').href = home; $('#back').href = home;
  $('#backLabel').textContent = t.backHome;

  /* Antes do lancamento a pagina e so das comissoes: o titulo diz isso e o
     cabecalho da seccao sai, para nao repetir "Comissoes" duas vezes. */
  const titulo = shopOn ? t.shopTitle : t.commTitle;
  $('#pageTitle').textContent = titulo;
  document.title = `${titulo} · Guita_Ink`;
  $('#jump').hidden = !shopOn;
  $('#jumpShop').textContent = t.shopJump;
  $('#jumpComm').textContent = t.commJump;
  $('#commHead').hidden = !shopOn;
  document.body.classList.toggle('so-comissoes', !shopOn);
  const hb = $('#headBadge');
  hb.hidden = shopOn;
  hb.textContent = open ? t.commOpen : t.commClosed;
  hb.className = 'badge ' + (open ? 'open' : 'closed');

  /* ---- merch ----
     O botao vai a coleccao merch e nao a /collections/all, que misturaria
     merch com comissoes. */
  $('#merch').hidden = !shopOn;
  if(shopOn){
    const merchColl = `${CONFIG.shop}/collections/${CONFIG.merchCollection}`;
    $('#merchTitle').textContent = t.merchTitle;
    const db = $('#dropBadge');
    db.textContent = CONFIG.shopDrop || '';
    db.hidden = !CONFIG.shopDrop;
    $('#shopIntro').textContent = t.shopIntro;
    $('#shopAll').href = merchColl;
    $('#shopAllLabel').textContent = t.shopAll;
    const mg = $('#merchGrid'); mg.innerHTML = '';
    CONFIG.merch.forEach(m => {
      const tm = t.merchItems[m.key];
      if(!tm) return;
      const card = document.createElement('a');
      card.className = 'merch-card';
      card.href = m.handle ? `${CONFIG.shop}/products/${m.handle}` : merchColl;
      card.target = '_blank'; card.rel = 'noopener';
      const art = document.createElement('div');
      art.className = 'art';
      if(m.src){
        const img = document.createElement('img');
        img.src = m.src; img.alt = tm.name; img.loading = 'lazy'; img.decoding = 'async';
        art.append(img);
      } else {
        /* sem foto do produto, a placa tipografica. Nunca uma ilustracao que
           nao seja do produto (§9.5). */
        const plate = document.createElement('div');
        plate.className = 'plate';
        plate.setAttribute('aria-hidden', 'true');
        plate.innerHTML = `<span>${m.plate || ''}</span>`;
        art.append(plate);
      }
      if(m.preorder){
        const f = document.createElement('span');
        f.className = 'flag';
        f.textContent = t.shopPreorder;
        art.append(f);
      }
      const from = m.from ? `<span class="from">${t.fromPrefix}</span>` : '';
      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML = `<h3>${tm.name}</h3><p>${tm.desc}</p>
        <span class="price">${from}<span class="n">${m.price}</span><span class="u">${m.unit || ''}</span></span>`;
      card.append(art, body);
      mg.append(card);
    });
  }

  /* ---- comissoes ---- */
  $('#commTitle').textContent = t.commTitle;
  const badge = $('#commBadge');
  badge.textContent = open ? t.commOpen : t.commClosed;
  badge.className = 'badge ' + (open ? 'open' : 'closed');
  $('#commIntro').textContent = t.commIntro;
  $('#commNote').textContent = t.commNote;
  /* Os cartoes nao sao links: sem preco na pagina, mandar alguem para o
     produto era mostrar-lhe o preco na mesma. A conversa comeca no email. */
  $('#tiers').innerHTML = CONFIG.tiers.map(x => {
    const tt = t.tiers[x.key];
    return `<div class="tier"><h3>${tt.name}</h3><p>${tt.desc}</p></div>`;
  }).join('');
  /* O email ja leva as perguntas cujas respostas preciso antes de dar um
     valor — as mesmas do PDF de onboarding. */
  $('#commCta').href = `mailto:${CONFIG.email}`
    + `?subject=${encodeURIComponent(t.mailSubject)}`
    + `&body=${encodeURIComponent(t.mailBody)}`;
  $('#commCtaLabel').textContent = t.commCta;
  $('#askLabel').textContent = t.questions;
  $('#askMail').textContent = CONFIG.email;
  $('#askMail').href = 'mailto:' + CONFIG.email;

  $('#footL').textContent = `© ${new Date().getFullYear()} ${CONFIG.artistName} · ${CONFIG.realName}`;
  $('#footIg').href = CONFIG.instagram;
}

render();
$('#langTgl').onclick = () => { LANG = LANG === 'en' ? 'pt' : 'en'; render(); };
$('#themeTgl').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
};
</script>
</body>
</html>
