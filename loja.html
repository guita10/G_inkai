     artistName, realName, email, instagram, shop, commissionsOpen,

   ================================================================ */

  shop: "https://xqms3c-zk.myshopify.com",              // Shopify: so o checkout

     com o PDF. Os precos vivem em dois sitios, e so dois:
        1. o produto no Shopify        2. Guita_Ink_Comissoes_PT.pdf (Drive)
     O `handle` fica porque e ele que da o link da loja no email de aceitacao.
     Fechar comissoes continua a ser DOIS gestos: commissionsOpen:false aqui E
     no index.html, e os produtos do Shopify em rascunho. */

  tiers: [
    { key: "headshot", handle: "commission-headshot-bust" },
    { key: "half",     handle: "commission-half-body" },
    { key: "full",     handle: "commission-full-body" },
    { key: "sheet",    handle: "commission-character-sheet" },

  /* ---------- MERCH ----------
     ⚠️ LANCAMENTO: shopOpen:false esconde a seccao merch desta pagina E o
        link "Loja" do menu do index. Ate la esta pagina so mostra as
        comissoes. No dia do lancamento sao TRES gestos, e a ordem importa:
        1. no Shopify, os produtos Merch a Activo E publicados na "Loja online"
        2. no Shopify, a coleccao "Merch — Guita_Ink" publicada na "Loja online"
        3. shopOpen:true AQUI E no index.html — por ultimo, com 1 e 2 feitos.
           O verify.mjs falha se os dois ficheiros nao disserem o mesmo.
        ACTIVO NAO E PUBLICADO. Os quatro produtos de comissao estiveram Activos
        durante dois meses e ninguem os conseguia abrir, porque nunca tinham

        variante (desenho x cor x tamanho) precisa do seu ID do Shopify:
        - opts: as opcoes, NA MESMA ORDEM do Shopify. `pick: true` = o
          visitante tem de escolher (o tamanho), nao ha valor por defeito.
        - variants: os IDs por ordem cartesiana: a primeira opcao muda mais
          devagar, a ultima mais depressa (Queen/Black/S, Queen/Black/M, ...).
          E a ordem em que o Shopify os lista.
        ⚠️ Os IDs sao COPIAS do Shopify (tirados a 30 Set 2026). Se a Printful
        voltar a sincronizar um produto e o Shopify lhe der IDs novos, estes
        deixam de funcionar: o checkout abre sem esse artigo. Depois de mexer
        num produto na Printful, pede os IDs de novo. O verify.mjs confere que
        ha um ID por combinacao, sem repetidos, mas nao ve o Shopify.
     NOTA: ao contrario das comissoes, estes precos estao na pagina. Uma
        comissao e orcamento e o numero vai por email (§9.4); um print a 18€ e
        preco de prateleira. Se alguma vez puseres um src aqui, lembra-te do
        §9.1: fan art nao se vende, nem como print nem como autocolante. */

section{padding:clamp(56px,8vw,104px) 0 0}

/* ---- merch: desde que se compra aqui (30 Set 2026) os cartoes ja nao sao

/* minmax(0,1fr) e nao 1fr: com 1fr a coluna nunca encolhe abaixo do conteudo

.merch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:30px}

}
.plate::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--sky) 1px,transparent 1.4px);background-size:16px 16px;opacity:.16}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:6px}

}

.cesto-fab{position:fixed;right:16px;bottom:16px;z-index:70}

.cesto-fab{transition:background .25s ease,border-color .25s ease,color .25s ease,

   fundo serve de dia e de noite (ver o index). */
#comissoes::after{
  content:"";display:block;width:100%;aspect-ratio:5424/2778;margin-top:clamp(30px,5vw,60px);
  background:url("images/bg/cast-cut-1000.png") center/contain no-repeat;
  background:image-set(url("images/bg/cast-cut-1920.webp") type("image/webp"),url("images/bg/cast-cut-1000.png") type("image/png")) center/contain no-repeat;
}
footer{font-family:var(--f-ui);
  margin-top:clamp(56px,8vw,104px);padding:24px 0 44px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:.8125rem;color:var(--bone-dim)}
footer a{text-decoration:none;transition:color .2s ease}
footer a:hover{color:var(--bone)}
.foot-links{display:flex;flex-wrap:wrap;gap:16px 22px}

/* toda a coisa que se carrega responde ao toque */
.btn:active,.knob:active{transform:scale(.97)}

@media (max-width:980px){
  .merch{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiers{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){
  .merch{gap:12px}
  .merch-card .body{padding:14px}
  .merch-card h3{font-size:1rem}
  .merch-card p{font-size:.875rem}
  /* no telemovel o nome da linha fica sozinho em cima; quantidade e preco por baixo */
  .linha{grid-template-columns:1fr auto}
  .linha > div:first-child{grid-column:1 / -1}
  .price .n{font-size:1.5rem}
  .tiers{grid-template-columns:1fr}
  /* o elenco mais leve no telemovel */
  #comissoes::after{background-image:url("images/bg/cast-cut-1000.png");
    background-image:image-set(url("images/bg/cast-cut-1000.webp") type("image/webp"),url("images/bg/cast-cut-1000.png") type("image/png"))}
  .bar{gap:12px}
  .logo{width:30px;height:30px}
  .brand b{display:none}          /* o selo chega; o nome nao cabe ao lado dos botoes */
}
/* Ecras de toque: o toque liga o :hover e ele fica preso. O botao cheio
   ("Pagar", "Perguntar") ficava oco depois de tocado. Aqui fica cheio. */
@media (hover:none){
  .btn.fill:hover{background:var(--sky);color:var(--void);border-color:var(--sky)}
}
/* §9.8 — sem efeitos nenhuns. A textura do grao fica: e parada. */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body,.knob,.btn,.back,.ask a,footer a,.opt select,.tirar,.cesto-fab{transition:none}
  .btn:active,.knob:active{transform:none}
}

      <span class="badge" id="commBadge"></span>
    </div>
    <p class="lede" id="commIntro"></p>
    <div class="tiers" id="tiers"></div>
    <p class="comm-note" id="commNote"></p>
    <div class="row">
      <a class="btn fill" id="commCta" href="#"><span id="commCtaLabel"></span> →</a>
    </div>
    <p class="ask"><span id="askLabel"></span> <a id="askMail" href="#"></a></p>
  </section>

  <a class="btn fill cesto-fab" id="cestoFab" href="#cesto" hidden></a>

  <footer>
    <span id="footL"></span>
    <span class="foot-links">
      <a id="footLr" href="#" target="_blank" rel="noopener"><span id="footLrLabel"></span> ↗</a>
      <a id="footIg" href="#" target="_blank" rel="noopener">Instagram ↗</a>
    </span>
  </footer>
</div>
</main>

<script>
const $ = s => document.querySelector(s);
/* A lingua: primeiro a que veio no link do index (?lang=pt), senao a do
   browser — a mesma regra do index. Assim quem mudou para PT la nao cai em
   EN aqui. */
const pedida = new URLSearchParams(location.search).get('lang');
let LANG = (pedida === 'pt' || pedida === 'en') ? pedida
  : ((navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en');

/* ================= O CESTO =================
   Compra-se nesta pagina: escolhe-se desenho, cor e tamanho, junta-se ao
   cesto, e "Finalizar compra" abre o checkout do Shopify ja com tudo dentro,
   por um cart permalink:  <loja>/cart/ID:QTD,ID:QTD
   So o pagamento sai daqui (o Shopify nao deixa pagar noutro sitio, e e a
   encomenda dele que a Printful recebe). Nao ha pedido nenhum ao Shopify ate
   ao clique: a pagina continua a abrir por file:// e sem rede. */

/* cada ID de variante → o produto e os valores escolhidos. Os IDs estao no
   CONFIG por ordem cartesiana: a ultima opcao muda mais depressa. */
const VARIANTES = {};
CONFIG.merch.forEach(m => {
  if(!m.variants || m.hold) return;
  m.variants.forEach((id, i) => {
    const valores = [];
    for(let o = m.opts.length - 1, r = i; o >= 0; o--){
      const n = m.opts[o].v.length;
      valores[o] = m.opts[o].v[r % n]; r = Math.floor(r / n);
    }
    VARIANTES[id] = { m, valores };
  });
});
function idDe(m, escolhas){
  let i = 0;
  m.opts.forEach((o, k) => { i = i * o.v.length + o.v.indexOf(escolhas[k]); });
  return m.variants[i];
}

/* guarda-se no browser de quem visita, para o cesto sobreviver a um recarregar
   ou a uma volta ao portefolio. Dois dias e esquece: quem volta uma semana
   depois de comprar nao deve encontrar o cesto antigo. Tudo em try/catch:
   numa janela privada o localStorage pode nao existir, e o cesto funciona
   na mesma, so nao fica guardado. */
const CHAVE = 'gi-cesto', VALIDADE = 2 * 864e5;
let cesto = (() => {
  try {
    const g = JSON.parse(localStorage.getItem(CHAVE) || 'null');
    if(!g || Date.now() - g.t > VALIDADE) return [];
    /* so IDs que o CONFIG ainda conhece: se um produto saiu, sai do cesto */
    return g.itens.filter(x => VARIANTES[x.id] && x.q > 0).map(x => ({ id: x.id, q: Math.min(x.q, 10) }));
  } catch(e){ return []; }
})();
function guarda(){
  try { localStorage.setItem(CHAVE, JSON.stringify({ t: Date.now(), itens: cesto })); } catch(e){}
}
function junta(id){
  const l = cesto.find(x => x.id === id);
  if(l) l.q = Math.min(l.q + 1, 10); else cesto.push({ id, q: 1 });
  guarda(); desenhaCesto();
}
function muda(id, d){
  const l = cesto.find(x => x.id === id);
  if(!l) return;
  l.q = Math.min(l.q + d, 10);
  if(l.q < 1) cesto = cesto.filter(x => x !== l);
  guarda(); desenhaCesto();
}
/* o link do checkout: exposto para o verify.mjs o poder conferir */
const linkCheckout = () => `${CONFIG.shop}/cart/` + cesto.map(x => `${x.id}:${x.q}`).join(',');

const nomeValor = (t, v) => t.optValues[v] || v;
const descreve = (t, id) => VARIANTES[id].valores.map(v => nomeValor(t, v)).join(' / ');

/* as opcoes de um cartao: um <select> por opcao com mais do que um valor
   (A4 e Mate sao unicos, nao ha nada a escolher) e o botao do cesto */
function opcoes(m, t){
  const box = document.createElement('div');
  box.className = 'opts';
  const selects = m.opts.map(o => {
    if(o.v.length < 2) return null;
    const lab = document.createElement('label');
    lab.className = 'opt';
    const s = document.createElement('select');
    /* o tamanho nao tem valor por defeito: um "S" escolhido por omissao e uma
       t-shirt do tamanho errado a caminho de alguem */
    s.innerHTML = (o.pick ? `<option value="" disabled selected>${t.pickOne}</option>` : '')
      + o.v.map(v => `<option value="${v}">${nomeValor(t, v)}</option>`).join('');
    s.onchange = () => { s.removeAttribute('aria-invalid'); msg.textContent = ''; };
    const sp = document.createElement('span');
    sp.textContent = t.optNames[o.k] || o.k;
    lab.append(sp, s); box.append(lab);
    return s;
  });
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn add';
  btn.textContent = t.addToBag;
  const msg = document.createElement('p');
  msg.className = 'card-msg';
  msg.setAttribute('role', 'status');
  let volta;
  btn.onclick = () => {
    const faltam = selects.filter(s => s && !s.value);
    if(faltam.length){
      faltam.forEach(s => s.setAttribute('aria-invalid', 'true'));
      msg.textContent = t.pickMissing;
      faltam[0].focus();
      return;
    }
    const id = idDe(m, m.opts.map((o, k) => selects[k] ? selects[k].value : o.v[0]));
    junta(id);
    const tt = CONFIG.i18n[LANG];
    $('#aviso').textContent = `${tt.merchItems[m.key].name}, ${descreve(tt, id)}: ${tt.addedLive}`;
    btn.textContent = tt.added;
    clearTimeout(volta);
    volta = setTimeout(() => { btn.textContent = CONFIG.i18n[LANG].addToBag; }, 1600);
  };
  if(!box.children.length) return [btn, msg];
  return [box, btn, msg];
}

function desenhaCesto(){
  const t = CONFIG.i18n[LANG];
  const n = cesto.reduce((a, x) => a + x.q, 0);
  const total = cesto.reduce((a, x) => a + x.q * Number(VARIANTES[x.id].m.price), 0);
  const unid = (CONFIG.merch[0] && CONFIG.merch[0].unit) || '€';
  $('#cestoTitle').textContent = t.bagTitle;
  $('#cestoVazio').textContent = t.bagEmpty;
  $('#cestoVazio').hidden = n > 0;
  $('#cestoFim').hidden = n === 0;
  const ul = $('#linhas'); ul.innerHTML = '';
  cesto.forEach(x => {
    const { m } = VARIANTES[x.id];
    const li = document.createElement('li');
    li.className = 'linha';
    li.dataset.id = x.id;
    li.innerHTML = `<div><b>${t.merchItems[m.key].name}</b><small>${descreve(t, x.id)}</small></div>
      <div class="qtd">
        <button type="button" class="knob menos" aria-label="${t.qtyLess}">−</button>
        <output aria-live="polite">${x.q}</output>
        <button type="button" class="knob mais" aria-label="${t.qtyMore}"${x.q >= 10 ? ' disabled' : ''}>+</button>
      </div>
      <div class="linha-fim"><span class="p">${x.q * Number(m.price)}${m.unit || ''}</span>
        <button type="button" class="tirar">${t.remove}</button></div>`;
    li.querySelector('.menos').onclick = () => muda(x.id, -1);
    li.querySelector('.mais').onclick = () => muda(x.id, +1);
    li.querySelector('.tirar').onclick = () => muda(x.id, -x.q);
    ul.append(li);
  });
  $('#totalLabel').textContent = t.bagTotal;
  $('#total').textContent = `${total}${unid}`;
  $('#portes').textContent = t.bagShipping;
  $('#pagar').href = n ? linkCheckout() : '#';
  $('#pagarLabel').textContent = t.checkout;
  $('#pagarNota').textContent = t.checkoutNote;
  const fab = $('#cestoFab');
  fab.textContent = `${t.bagShort} · ${n} · ${total}${unid} ↓`;
  fab.setAttribute('aria-label', `${t.bagShort}: ${n}, ${t.bagTotal} ${total}${unid}`);
  fab.dataset.cheio = n > 0 ? '1' : '';
  mostraFab();
}

/* o atalho no canto so aparece com o cesto cheio E o cesto fora do ecra;
   quem ja esta a olhar para ele nao precisa do atalho. IntersectionObserver
   e nao um listener de scroll (§6). */
let cestoAVista = false;
function mostraFab(){
  const fab = $('#cestoFab');
  fab.hidden = !fab.dataset.cheio || cestoAVista || $('#merch').hidden;
}
if('IntersectionObserver' in window){
  new IntersectionObserver(es => { cestoAVista = es[0].isIntersecting; mostraFab(); })
    .observe($('#cesto'));
}

function render(){
  const t = CONFIG.i18n[LANG];
  const shopOn = !!CONFIG.shopOpen;
  const open = !!CONFIG.commissionsOpen;
  document.documentElement.lang = LANG;
  $('#langTgl').textContent = LANG === 'en' ? 'PT' : 'EN';
  /* o regresso ao portefolio leva a lingua consigo */
  const home = LANG === 'pt' ? 'index.html?lang=pt' : 'index.html';
  $('#brand').href = home; $('#back').href = home;
  $('#backLabel').textContent = t.backHome;

  /* Antes do lancamento a pagina e so das comissoes: o titulo diz isso e o
     cabecalho da seccao sai, para nao repetir "Comissoes" duas vezes. */
  const titulo = shopOn ? t.shopTitle : t.commTitle;
  $('#pageTitle').textContent = titulo;
  document.title = `${titulo} · Guita_Ink`;
  $('#jump').hidden = !shopOn;
  $('#jumpShop').textContent = t.shopJump;
  $('#jumpComm').textContent = t.commJump;
  $('#commHead').hidden = !shopOn;
  document.body.classList.toggle('so-comissoes', !shopOn);
  const hb = $('#headBadge');
  hb.hidden = shopOn;
  hb.textContent = open ? t.commOpen : t.commClosed;
  hb.className = 'badge ' + (open ? 'open' : 'closed');

  /* ---- merch ----
     O botao vai a coleccao merch e nao a /collections/all, que misturaria
     merch com comissoes. */
  $('#merch').hidden = !shopOn;
  if(shopOn){
    const merchColl = `${CONFIG.shop}/collections/${CONFIG.merchCollection}`;
    $('#merchTitle').textContent = t.merchTitle;
    const db = $('#dropBadge');
    db.textContent = CONFIG.shopDrop || '';
    db.hidden = !CONFIG.shopDrop;
    $('#shopIntro').textContent = t.shopIntro;
    $('#shopAll').href = merchColl;
    $('#shopAllLabel').textContent = t.shopAll;
    const mg = $('#merchGrid'); mg.innerHTML = '';
    CONFIG.merch.forEach(m => {
      const tm = t.merchItems[m.key];
      /* hold: true = o produto existe no Shopify mas nao esta publicado, por
         isso o cartao nao aparece (senao ia para o checkout um artigo que nao se
         pode comprar).
         Set 2026: a edicao limitada espera por originais maiores (as A3 dao
         ~200 DPI) e o porta-chaves por um fornecedor. Tirar o hold e publicar
         o produto no Shopify, as duas coisas juntas. */
      if(!tm || m.hold) return;
      const card = document.createElement('article');
      card.className = 'merch-card';
      card.dataset.key = m.key;
      const art = document.createElement('div');
      art.className = 'art';
      if(m.src){
        const img = document.createElement('img');
        /* largura e altura antes do src: o browser reserva o quadrado antes de
           a foto chegar e os cartoes nao saltam (as fotos sao 800x800). */
        if(m.w && m.h){ img.width = m.w; img.height = m.h; }
        img.src = m.src; img.alt = tm.name; img.loading = 'lazy'; img.decoding = 'async';
        art.append(img);
      } else {
        /* sem foto do produto, a placa tipografica. Nunca uma ilustracao que
           nao seja do produto (§9.5). */
        const plate = document.createElement('div');
        plate.className = 'plate';
        plate.setAttribute('aria-hidden', 'true');
        plate.innerHTML = `<span>${m.plate || ''}</span>`;
        art.append(plate);
      }
      if(m.preorder){
        const f = document.createElement('span');
        f.className = 'flag';
        f.textContent = t.shopPreorder;
        art.append(f);
      }
      const from = m.from ? `<span class="from">${t.fromPrefix}</span>` : '';
      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML = `<h3>${tm.name}</h3><p>${tm.desc}</p>
        <span class="price">${from}<span class="n">${m.price}</span><span class="u">${m.unit || ''}</span></span>`;
      if(m.variants) body.append(...opcoes(m, t));
      card.append(art, body);
      mg.append(card);
    });
    desenhaCesto();
  }

  /* ---- comissoes ---- */
  $('#commTitle').textContent = t.commTitle;
  const badge = $('#commBadge');
  badge.textContent = open ? t.commOpen : t.commClosed;
  badge.className = 'badge ' + (open ? 'open' : 'closed');
  $('#commIntro').textContent = t.commIntro;
  $('#commNote').textContent = t.commNote;
  /* Os cartoes nao sao links: sem preco na pagina, mandar alguem para o
     produto era mostrar-lhe o preco na mesma. A conversa comeca no email. */
  $('#tiers').innerHTML = CONFIG.tiers.map(x => {
    const tt = t.tiers[x.key];
    return `<div class="tier"><h3>${tt.name}</h3><p>${tt.desc}</p></div>`;
  }).join('');
  /* O email ja leva as perguntas cujas respostas preciso antes de dar um
     valor — as mesmas do PDF de onboarding. */
  $('#commCta').href = `mailto:${CONFIG.email}`
    + `?subject=${encodeURIComponent(t.mailSubject)}`
    + `&body=${encodeURIComponent(t.mailBody)}`;
  $('#commCtaLabel').textContent = t.commCta;
  $('#askLabel').textContent = t.questions;
  $('#askMail').textContent = CONFIG.email;
  $('#askMail').href = 'mailto:' + CONFIG.email;

  $('#footL').textContent = `© ${new Date().getFullYear()} ${CONFIG.artistName} · ${CONFIG.realName}`;
  $('#footIg').href = CONFIG.instagram;
  $('#footLrLabel').textContent = t.footComplaints;
  $('#footLr').href = CONFIG.livroReclamacoes;
}

render();
$('#langTgl').onclick = () => { LANG = LANG === 'en' ? 'pt' : 'en'; render(); };
$('#themeTgl').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
};
</script>
</body>
</html>
