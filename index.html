/* ================= TOKENS ================= */
:root{
  --void:#0A0A0A;         /* the field */
  --raise:#121212;        /* raised surface */
  --raise-2:#1A1A1A;
  --royal:#2E45FF;        /* Queen of Jacks blue */
  --royal-lift:#5568FF;   /* for small text on near-black */
  --bone:#F2F0EC;
  --bone-dim:#8C877F;
  --hair:rgba(242,240,236,.13);
  --f-disp:'Playfair Display',Georgia,serif;
  --f-body:'LT Museum','Lora',Georgia,serif;      /* corpo — LT Museum se estiver instalada */
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
}
[data-theme="light"]{
  --void:#F4F2ED;
  --raise:#FFFFFF;
  --raise-2:#EDEAE3;
  --royal:#2436C9;
  --royal-lift:#2436C9;
  --bone:#141310;
  --bone-dim:#6B655C;
  --hair:rgba(20,19,16,.13);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body);background:var(--void);color:var(--bone);
  line-height:1.65;font-weight:300;-webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit}
::selection{background:var(--royal);color:#fff}
:focus-visible{outline:2px solid var(--royal-lift);outline-offset:3px}

.skip{
  position:absolute;left:-9999px;top:10px;z-index:200;background:var(--royal);color:#fff;
  padding:10px 18px;border-radius:2px;font:500 .8rem var(--f-ui);text-decoration:none;
}
.skip:focus{left:10px}
/* so aparece quando o JavaScript nao corre — ver o <noscript> no <body> */
.noscript-note{
  max-width:1240px;margin:0 auto;padding:28px 26px;position:relative;z-index:1;
  border-bottom:1px solid var(--hair);display:grid;gap:8px;
}
.noscript-note b{font-family:var(--f-disp);font-weight:500}
.noscript-note p{color:var(--bone-dim);font-size:.9rem}
.noscript-note a{color:var(--royal-lift)}
.wrap{max-width:1240px;margin:0 auto;padding:0 26px;position:relative;z-index:1}
/* film grain */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.16'/></svg>");
}
header,main,footer{position:relative;z-index:1}

/* ================= TYPE ================= */
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.06;letter-spacing:-.01em}
.kicker{font-family:var(--f-ui);
  font-size:.66rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;
  color:var(--bone-dim);display:flex;align-items:center;gap:12px;
}
.kicker::before{content:"";width:26px;height:1px;background:var(--royal-lift);flex:none}
.sec-title{font-size:clamp(1.7rem,3.6vw,2.6rem);margin-top:16px;text-transform:uppercase;letter-spacing:.10em}
.sec-title em{font-style:italic;color:var(--royal-lift)}
.lede{color:var(--bone-dim);max-width:36rem;margin-top:16px;font-size:1rem}

/* ================= HEADER ================= */
header{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--void) 82%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);
}
.bar{display:flex;align-items:center;gap:18px;padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.seal{
  width:30px;height:30px;flex:none;border-radius:8px;background:var(--royal);
  display:grid;place-items:center;font-family:var(--f-disp);font-size:.95rem;color:#fff;
}
.brand b{font-family:var(--f-disp);font-weight:500;font-size:1.1rem;letter-spacing:.01em}
.links{font-family:var(--f-ui);display:flex;gap:26px;margin-left:auto;font-size:.8rem;letter-spacing:.02em}
.links a{text-decoration:none;color:var(--bone-dim);transition:color .2s;position:relative}
.links a:hover{color:var(--bone)}
.knobs{display:flex;gap:8px;margin-left:22px}
.knob{
  height:34px;min-width:34px;padding:0 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--hair);background:transparent;color:var(--bone-dim);
  /* atencao: o atalho `font:` define TAMBEM a familia. Ter um font-family
     antes dele nao serve de nada — e apagado por esta linha. */
  font:500 .68rem/1 var(--f-ui);letter-spacing:.1em;transition:all .2s;
}
.knob:hover{border-color:var(--royal-lift);color:var(--bone)}

/* ================= BUTTONS ================= */
.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;
  font:400 .86rem var(--f-ui);letter-spacing:.02em;padding:13px 26px;border-radius:2px;
  border:1px solid var(--hair);color:var(--bone);background:transparent;transition:all .25s;
}
.btn:hover{border-color:var(--royal-lift);color:var(--bone)}
.btn.fill{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.fill:hover{background:transparent;color:var(--bone);border-color:var(--royal-lift)}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* ================= HERO ================= */
.hero{padding:clamp(60px,9vw,120px) 0 clamp(50px,7vw,90px);position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.72fr);gap:60px;align-items:end}
.hero h1{font-size:clamp(3.2rem,9vw,7rem);letter-spacing:-.025em}
.hero h1 em{font-style:italic;color:var(--royal-lift);display:block}
.hero .sub{font-family:var(--f-ui);
  font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-dim);
  margin:26px 0 18px;
}
.hero .tag{color:var(--bone-dim);max-width:30rem;margin-bottom:34px;font-size:1.02rem}
.hero-art{position:relative}
.hero-art .shot{overflow:hidden;border:1px solid var(--hair);background:var(--raise)}
.hero-art .cap{
  display:flex;justify-content:space-between;gap:14px;margin-top:12px;
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);
}
/* thin rule + running count under the hero */
.hero-rule{
  display:flex;align-items:center;gap:20px;margin-top:clamp(40px,6vw,70px);
  padding-top:22px;border-top:1px solid var(--hair);
  font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);
}
.hero-rule b{font-family:var(--f-disp);font-weight:400;font-size:1.5rem;color:var(--bone);letter-spacing:0}
.hero-rule .sp{flex:1}

/* ================= SECTIONS ================= */
section{padding:clamp(56px,8vw,96px) 0;border-top:1px solid var(--hair)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:38px}
.count{font-family:var(--f-disp);font-size:.95rem;color:var(--bone-dim);font-style:italic}

/* ================= FILMSTRIP GALLERY ================= */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{
  font:400 .76rem var(--f-ui);letter-spacing:.04em;padding:8px 16px;border-radius:999px;
  cursor:pointer;border:1px solid var(--hair);background:transparent;color:var(--bone-dim);transition:all .2s;
}
.chip:hover{color:var(--bone);border-color:var(--royal-lift)}
.chip.on{background:var(--bone);border-color:var(--bone);color:var(--void)}
.strip-wrap{position:relative;margin:0 -26px;padding:0 26px}
.strip{
  display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding:4px 0 24px;scrollbar-width:thin;scrollbar-color:var(--hair) transparent;
}
.strip::-webkit-scrollbar{height:3px}
.strip::-webkit-scrollbar-track{background:var(--hair)}
.strip::-webkit-scrollbar-thumb{background:var(--royal)}
.frame{
  flex:none;scroll-snap-align:start;cursor:zoom-in;position:relative;
  background:var(--raise);border:1px solid var(--hair);overflow:hidden;
  transition:border-color .3s;
}
.frame:hover{border-color:var(--royal-lift)}
.frame.r-34{width:clamp(210px,25vw,290px)}
.frame.r-11{width:clamp(240px,28vw,330px)}
.frame.r-12{width:clamp(170px,20vw,230px)}
.frame.r-43{width:clamp(280px,34vw,400px)}
.frame img,.frame .ph{width:100%;height:100%;object-fit:cover}
.lb-stage img{width:auto;height:auto}
.frame .meta{
  position:absolute;inset:auto 0 0 0;padding:40px 14px 12px;
  background:linear-gradient(transparent,rgba(6,6,6,.88));
  opacity:0;transition:opacity .3s;
}
.frame:hover .meta{opacity:1}
.frame .meta .t{font-family:var(--f-disp);font-size:.92rem;color:#fff}
.frame .meta .n{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--royal-lift)}
.frame.hidden{display:none}
.strip-nav{display:flex;gap:8px;margin-top:6px}
.strip-nav button{
  width:38px;height:38px;border-radius:999px;cursor:pointer;background:transparent;
  border:1px solid var(--hair);color:var(--bone-dim);font-size:1rem;transition:all .2s;
}
.strip-nav button:hover{border-color:var(--royal-lift);color:var(--bone)}
.hint{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);align-self:center;margin-left:10px}

/* placeholder */
.ph{
  display:grid;place-content:center;text-align:center;gap:6px;padding:18px;
  background:repeating-linear-gradient(-45deg,transparent 0 12px,rgba(46,69,255,.10) 12px 13px),var(--raise-2);
  color:var(--bone-dim);
}
.ph b{font-family:var(--f-disp);font-weight:400;font-size:1rem;color:var(--bone);line-height:1.1}
.ph span{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase}
.r-34{aspect-ratio:3/4}.r-12{aspect-ratio:1/2}.r-11{aspect-ratio:1/1}.r-43{aspect-ratio:4/3}

/* ================= PROJECTS ================= */
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.proj{
  text-decoration:none;color:inherit;background:var(--raise);border:1px solid var(--hair);
  display:flex;flex-direction:column;transition:border-color .3s,transform .3s;
}
.proj:hover{border-color:var(--royal-lift);transform:translateY(-4px)}
.proj .body{padding:24px;display:flex;flex-direction:column;gap:9px;flex:1}
.plate{
  display:grid;place-items:center;background:var(--raise-2);position:relative;overflow:hidden;
  border-bottom:1px solid var(--hair);
}
.plate::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--royal) 1px,transparent 1.4px);background-size:14px 14px;opacity:.16;
}
.plate span{
  font-family:var(--f-disp);font-size:clamp(2.6rem,7vw,4rem);color:var(--royal-lift);
  letter-spacing:.04em;z-index:1;
}
.proj .k{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--royal-lift)}
.proj h3{font-size:1.4rem}
.proj p{font-size:.86rem;color:var(--bone-dim)}
.proj .go{margin-top:6px;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim)}
.proj:hover .go{color:var(--bone)}

/* ================= TIMELINE ================= */
.tl{display:grid;grid-template-columns:104px 1fr}
.tl-year{
  font-family:var(--f-disp);font-size:1.9rem;text-align:right;padding:22px 22px 0 0;
  color:var(--bone);opacity:.22;transition:opacity .3s;
}
.tl-year:first-child{padding-top:0}
.tl-year.has-next{opacity:1;color:var(--royal-lift)}
.tl-item{position:relative;padding:0 0 34px 28px;border-left:1px solid var(--hair)}
.tl-item:last-child{border-left-color:transparent}
.tl-item:last-child::after{content:"";position:absolute;left:-1px;top:0;height:28px;width:1px;background:var(--hair)}
.tl-dot{position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:999px;background:var(--bone-dim)}
.tl-item.next .tl-dot{background:var(--royal)}
.tl-item.next{border-left-style:dashed;border-left-color:var(--royal)}
.tl-when{font-family:var(--f-ui);font-size:.63rem;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl-flag{font-family:var(--f-ui);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--royal);padding:3px 9px;border-radius:999px}
.tl-item h3{font-size:1.32rem;margin:8px 0 3px}
.tl-where{font-size:.74rem;letter-spacing:.06em;color:var(--royal-lift);margin-bottom:7px}
.tl-desc{font-size:.88rem;color:var(--bone-dim);max-width:42rem}

/* ================= ABOUT ================= */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center}
.about p.body{font-family:var(--f-disp);font-size:1.28rem;line-height:1.6}
.about .meta{margin-top:22px;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.about-mark{
  aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;
  border:1px solid var(--hair);background:var(--raise);
}
.about-mark .glyph{font-family:var(--f-disp);font-size:clamp(4rem,11vw,7rem);color:var(--royal-lift);z-index:1}
.about-mark::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--royal) 1px,transparent 1.4px);background-size:13px 13px;opacity:.22;
}

/* ================= COMMISSIONS ================= */
.badge{font-family:var(--f-ui);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:8px 16px;border-radius:999px}
.badge.open{background:var(--royal);color:#fff}
.badge.closed{border:1px solid var(--hair);color:var(--bone-dim)}
.turnaround{
  font-family:var(--f-ui);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--bone-dim);margin:-14px 0 46px;
}
.steps-title{font-size:1.3rem;margin-bottom:22px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;counter-reset:s}
.steps li{border-top:1px solid var(--royal);padding-top:16px}
.steps .n{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.2em;color:var(--royal-lift)}
.steps h4{font-family:var(--f-disp);font-weight:400;font-size:1.1rem;margin:8px 0 6px}
.steps p{font-size:.84rem;color:var(--bone-dim)}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.steps{grid-template-columns:1fr}}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);margin-bottom:30px}
.tier{background:var(--void);padding:28px 22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:background .3s}
.tier:hover{background:var(--raise)}
.tier h3{font-size:1.15rem}
.tier .price{font-family:var(--f-disp);color:var(--royal-lift);display:flex;align-items:baseline;gap:3px}
.tier .price .from{font-family:var(--f-body);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin-right:5px}
.tier .price .n{font-size:2.4rem;line-height:.9}
.tier .price .u{font-size:1.05rem}
.tier p{font-size:.8rem;color:var(--bone-dim);flex:1}

/* ================= CONTACT ================= */
.mail{
  font-family:var(--f-disp);font-size:clamp(1.6rem,5vw,3.2rem);text-decoration:none;
  color:var(--bone);display:inline-block;transition:color .25s;line-height:1.1;
}
.mail:hover{color:var(--royal-lift)}
.c-links{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px;font-size:.8rem}
.c-links a{font-family:var(--f-ui);color:var(--bone-dim);text-decoration:none;transition:color .2s}
.c-links a:hover{color:var(--bone)}
footer{font-family:var(--f-ui);
  padding:26px 0 46px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);
}

/* ================= LIGHTBOX ================= */
.lb{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:5vh 5vw;background:rgba(5,5,5,.95);backdrop-filter:blur(8px)}
.lb.open{display:grid}
.lb-stage{max-width:min(92vw,860px);max-height:78vh;display:grid;place-items:center}
.lb-stage img,.lb-stage .ph{max-height:74vh}
.lb-stage .ph{width:min(70vw,440px)}
.lb-cap{color:var(--bone);font-size:.8rem;margin-top:16px;text-align:center;font-family:var(--f-disp)}
.lb-hint{color:var(--bone-dim);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;margin-top:8px;text-align:center}
.lb-btn{position:fixed;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;cursor:pointer;width:44px;height:44px;border-radius:999px;font-size:1.2rem;transition:all .2s}
.lb-btn:hover{background:var(--royal);border-color:var(--royal)}
.lb-close{top:22px;right:22px}
.lb-prev{left:18px;top:50%;transform:translateY(-50%)}
.lb-next{right:18px;top:50%;transform:translateY(-50%)}


/* ================= VFX ================= */

/* 1. INK BLEED — títulos revelam-se como tinta a espalhar-se no papel */
.sec-title.rv{opacity:1;transform:none}   /* o reveal do título é o clip-path, não o fade */
.sec-title{
  clip-path:inset(0 100% 0 0);
  transition:clip-path 1.1s cubic-bezier(.16,.84,.36,1);
}
.sec-title.in{clip-path:inset(0 0 0 0)}

/* 2. SCREENTONE SWEEP — trama manga que atravessa a obra ao passar o rato */
.frame::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
  background-image:radial-gradient(var(--royal) 1.2px,transparent 1.4px);
  background-size:7px 7px;
  -webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 50%,transparent 65%);
  mask-image:linear-gradient(115deg,transparent 35%,#000 50%,transparent 65%);
  -webkit-mask-size:280% 100%;mask-size:280% 100%;
  -webkit-mask-position:120% 0;mask-position:120% 0;
  transition:opacity .35s ease,-webkit-mask-position .85s ease,mask-position .85s ease;
}
.frame:hover::after{opacity:.5;-webkit-mask-position:-40% 0;mask-position:-40% 0}

/* 3. SPEED LINES — linhas de velocidade que entram sob o título do hero */
.hero h1{position:relative}
.hero h1::before{
  content:"";position:absolute;left:-6%;top:50%;width:0;height:62%;transform:translateY(-50%);
  z-index:-1;opacity:0;
  background:repeating-linear-gradient(90deg,
    var(--royal) 0 1px, transparent 1px 7px);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent);
  mask-image:linear-gradient(90deg,#000,transparent);
  animation:speed 1.1s .5s cubic-bezier(.16,.84,.36,1) forwards;
}
@keyframes speed{to{width:38%;opacity:.32}}

/* 4. PARALLAX — a obra do hero flutua com o scroll */
.hero-art .shot{will-change:transform}

/* 5. GLINT — brilho que atravessa os botões cheios */
.btn.fill{position:relative;overflow:hidden}
.btn.fill::after{
  content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transition:left .65s ease;
}
.btn.fill:hover::after{left:130%}

/* 6. SEAL — o selo 墨 assenta ao carregar, como um carimbo */
.seal{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{
  from{transform:scale(1.5) rotate(-14deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

/* 7. DOT — o marcador do percurso pulsa quando entra em cena */
.tl-item.in .tl-dot{animation:ping .9s ease-out}
@keyframes ping{
  0%{box-shadow:0 0 0 0 var(--royal)}
  100%{box-shadow:0 0 0 12px transparent}
}

/* 8. PREÇOS — sobem ao entrar, escalonados */
.tier{transition:transform .3s ease,background .3s ease}
.tier:hover{transform:translateY(-4px)}

/* Respeitar quem pediu menos movimento — desliga tudo isto */
@media (prefers-reduced-motion:reduce){
  .sec-title{clip-path:none;transition:none}
  .frame::after,.btn.fill::after{display:none}
  .hero h1::before,.seal{animation:none}
  .seal{opacity:1;transform:none}
  .tl-item.in .tl-dot{animation:none}
  .hero-art .shot{transform:none !important}
}

/* ================= MOTION ================= */
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .strip{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .proj,.frame,.btn,.tier,.mail{transition:none}
}

/* ================= RESPONSIVE ================= */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:44px;align-items:start}
  .hero-art{max-width:400px}
  .projects{grid-template-columns:1fr}
  .about{grid-template-columns:1fr;gap:38px}
  .about-mark{max-width:300px}
  .tiers{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){
  .links{display:none}
  .knobs{margin-left:auto}
  .tiers{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr}
  .tl-year{text-align:left;padding:20px 0 10px;font-size:1.6rem}
  .tl-year:first-child{padding-top:0}
  .strip-nav{display:none}
}
</style>

      <a class="btn fill" id="commShop" href="#" target="_blank" rel="noopener"><span data-t="commShop"></span> →</a>
      <a class="btn" id="commCta" href="#"><span data-t="commCta"></span></a>

  <section id="contact">

    <div class="rv">
      <p class="lede" style="margin-bottom:26px" data-t="contactBody"></p>

<!-- LIGHTBOX -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-btn lb-prev"  id="lbPrev"  aria-label="Previous">‹</button>
  <button class="lb-btn lb-next"  id="lbNext"  aria-label="Next">›</button>
  <div>
    <div class="lb-stage" id="lbStage"></div>
    <p class="lb-cap" id="lbCap"></p>
    <p class="lb-hint" data-t="lightboxHint"></p>
  </div>
</div>
<script>
/* ================  RENDER — no need to edit below  ================ */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let LANG = (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en';
let activeCat = 'all';
/* o tema segue a preferência do sistema; o botão continua a mandar por cima */
if(matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
const T  = () => CONFIG.i18n[LANG];
const rc = r => ({'34':'r-34','12':'r-12','11':'r-11','43':'r-43'})[String(r)] || 'r-34';
const pretty = r => ({'34':'3:4','12':'1:2','11':'1:1','43':'4:3'})[String(r)] || r;
const no = i => String(i + 1).padStart(3, '0');
const srcOf = s => /^https?:\/\//i.test(s) ? s : (CONFIG.imageBase || '') + s;

/* image that degrades to a labelled placeholder when the file is missing.
   full=false  → serve images/thumb/… (760px) — grelha, tira, cartões
   full=true   → serve o ficheiro grande (1600px) — só no lightbox            */
const DIMS = {"aki.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"arkevil-final.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"clair.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"collab-mira-final.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"collab.jpg":{"w":1600,"h":1280,"tw":760,"th":608},"dante.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"estudo-luz.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"even-yeager.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"final-aot-season-4.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"geisha.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"ilustracao-sem-titulo-1.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"ilustracao-sem-titulo.jpg":{"w":1600,"h":1067,"tw":760,"th":507},"italy.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"kon.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"lucy.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"makima.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"mira-starborn.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"nami-30x40.jpg":{"w":1200,"h":1600,"tw":570,"th":760},"oc-1.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"oc-2.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"oc.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"pochita.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"shocked.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"silen.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"spain.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"surpresa.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"the-witch.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"yuta-fanart.jpg":{"w":1280,"h":1600,"tw":608,"th":760}};
/* O browser suporta WebP? Testamos uma vez. O WebP pesa menos ~39% com a mesma
   qualidade — quem nao suportar recebe o .jpg de sempre, sem dar por nada.
   Os .webp geram-se com:  python3 tools/make-webp.py                          */
const WEBP_OK = (() => {
  try { return document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0; }
  catch(e){ return false; }
})();

function artEl(item, full){
  const img = document.createElement('img');
  const file = item.src.split('/').pop();
  const jpg = full ? item.src : item.src.replace(/^images\//,'images/thumb/');
  const webp = jpg.replace(/\.jpe?g$/i, '.webp');
  const useWebp = WEBP_OK && webp !== jpg;
  const d = DIMS[file];
  if(d){ img.width = full ? d.w : d.tw; img.height = full ? d.h : d.th; }
  /* Ecras retina precisam do dobro dos pixeis. A miniatura de 608px chega para
     a grelha (as molduras sao pequenas), mas NAO chega para a obra do hero, que
     aparece grande: num telemovel @2x sai a 0,90x e num @3x a 0,60x, ou seja,
     desfocada. Com srcset o browser escolhe — ficheiro pequeno em ecras 1x,
     original em retina. So o hero leva isto; por na grelha faria cada moldura
     puxar a imagem grande, que e exactamente o que nao queremos.
     O srcset TEM de ser definido antes do src: ao contrario, o browser ja
     comecou a descarregar o src e acaba por puxar os dois ficheiros.          */
  if(item.wide && !full && d){
    const big = useWebp ? item.src.replace(/\.jpe?g$/i, '.webp') : item.src;
    img.sizes = item.sizes || '100vw';
    img.srcset = `${srcOf(useWebp ? webp : jpg)} ${d.tw}w, ${srcOf(big)} ${d.w}w`;
  }
  img.src = srcOf(useWebp ? webp : jpg); img.alt = item.label;
  img.decoding = 'async';
  if(item.eager){ img.fetchPriority = 'high'; } else { img.loading = 'lazy'; }
  img.className = rc(item.ratio);
  let jpgTried = !useWebp;
  img.onerror = () => {
    if(!jpgTried){          // .webp em falta (arte nova sem converter?) → tenta o .jpg
      jpgTried = true;
      img.src = srcOf(jpg);
      return;
    }
    const ph = document.createElement('div');
    ph.className = 'ph ' + rc(item.ratio);
    ph.innerHTML = `<b>${item.label}</b><span data-ph>${T().placeholderNote}</span><span style="opacity:.5">${pretty(item.ratio)}</span>`;
    if(img.parentNode) img.replaceWith(ph);
  };
  return img;
}

/* ---------- filmstrip ---------- */
function renderStrip(){
  const s = $('#strip'); s.innerHTML = '';
  CONFIG.artworks.forEach((g,i) => {
    const fig = document.createElement('figure');
    fig.className = 'frame ' + rc(g.ratio);
    fig.dataset.cat = g.cat;
    fig.tabIndex = 0; fig.setAttribute('role','button'); fig.setAttribute('aria-label', g.label);
    const meta = document.createElement('figcaption');
    meta.className = 'meta';
    meta.innerHTML = `<div class="n">${no(i)}</div><div class="t">${g.label}</div>`;
    fig.append(artEl(g), meta);
    fig.onclick = () => openLb(i);
    fig.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(i); } };
    s.append(fig);
  });
  applyFilter();
}
function setFilter(c){
  activeCat = c;
  $$('#filters .chip').forEach(b => {
    const on = b.dataset.cat === c;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  applyFilter();
  $('#strip').scrollTo({left:0});
}
function applyFilter(){
  let shown = 0;
  $$('#strip .frame').forEach(f => {
    const hide = activeCat !== 'all' && f.dataset.cat !== activeCat;
    f.classList.toggle('hidden', hide);
    if(!hide) shown++;
  });
  $('#workCount').textContent = `${shown} / ${CONFIG.artworks.length}`;
}
const step = () => Math.max(240, $('#strip').clientWidth * .7);
$('#stripPrev').onclick = () => $('#strip').scrollBy({left:-step()});
$('#stripNext').onclick = () => $('#strip').scrollBy({left: step()});

/* ---------- language-independent hero art ---------- */
function renderHeroArt(){
  const h = $('#heroShot'); h.innerHTML = '';
  /* sizes tem de descrever a largura REAL da imagem no ecra, senao o browser
     escolhe mal: ate 980px a coluna e .hero-art (max 400px), acima disso a
     grelha do hero da-lhe cerca de 470px. */
  h.append(artEl({
    ...CONFIG.hero,
    eager: true,
    wide: true,
    sizes: '(max-width: 980px) min(calc(100vw - 52px), 400px), 470px',
  }));
  $('#heroCap').textContent = CONFIG.hero.label;
}

/* ---------- everything language-dependent ---------- */
function renderText(){
  const t = T();
  $$('[data-t]').forEach(el => el.textContent = t[el.dataset.t] || '');
  $$('[data-ph]').forEach(el => el.textContent = t.placeholderNote);
  document.documentElement.lang = LANG;
  $('#langTgl').textContent = LANG === 'en' ? 'PT' : 'EN';
  $('#brandName').textContent = CONFIG.artistName;
  $('#statNum').textContent = CONFIG.artworks.length;

  /* filters */
  const cats = [...new Set(CONFIG.artworks.map(g => g.cat))];
  $('#filters').innerHTML = ['all', ...cats].map(c =>
    `<button class="chip ${c === activeCat ? 'on' : ''}" data-cat="${c}" aria-pressed="${c === activeCat}">${t.filters[c] || c}</button>`).join('');
  $$('#filters .chip').forEach(b => b.onclick = () => setFilter(b.dataset.cat));
  applyFilter();

  /* projects */
  const grid = $('#projGrid'); grid.innerHTML = '';
  CONFIG.projects.forEach(p => {
    const tp = t.projects[p.key];
    const card = document.createElement('a');
    card.className = 'proj rv';
    card.href = `${CONFIG.projectPage}?p=${encodeURIComponent(p.key)}`;
    card.target = '_blank'; card.rel = 'noopener';
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `<span class="k">${tp.kicker}</span><h3>${tp.title}</h3><p>${tp.desc}</p>
      <span class="go">${t.openProject} ↗</span>`;
    if(p.src){
      card.append(artEl(p), body);
    } else {
      const plate = document.createElement('div');
      plate.className = 'plate ' + rc(p.ratio);
      plate.setAttribute('aria-hidden','true');
      plate.innerHTML = `<span>${p.plate || ''}</span>`;
      card.append(plate, body);
    }
    grid.append(card);
  });

  /* timeline — grouped by year, oldest first */
  const tl = $('#tl'); tl.innerHTML = '';
  const evts = [...CONFIG.timeline].sort((a,b) =>
    (a.year - b.year)
    || (a.status === b.status ? 0 : (a.status === 'past' ? -1 : 1))
    || ((a.month || 13) - (b.month || 13)));
  const firstNext = evts.find(e => e.status === 'next');
  let lastYear = null;
  evts.forEach(e => {
    const te = t.timeline[e.key];
    const cell = document.createElement('div');
    cell.className = 'tl-year';
    if(e.year !== lastYear){
      lastYear = e.year;
      cell.classList.add('rv');
      if(evts.some(x => x.year === e.year && x.status === 'next')) cell.classList.add('has-next');
      cell.textContent = e.year;
    }
    tl.append(cell);
    const when = e.month ? `${t.months[e.month-1]} ${e.year}` : `${e.year}`;
    const flag = e.status === 'next'
      ? `<span class="tl-flag">${e === firstNext ? t.tlNext : t.tlUpcoming}</span>` : '';
    const item = document.createElement('article');
    item.className = `tl-item rv ${e.status}`;
    item.innerHTML =
      `<span class="tl-dot" aria-hidden="true"></span>
       <p class="tl-when">${when}${flag}</p>
       <h3>${te.title}</h3>
       <p class="tl-where">${te.where}</p>
       <p class="tl-desc">${te.desc}</p>`;
    tl.append(item);
  });

  /* commissions */
  const open = CONFIG.commissionsOpen;
  const badge = $('#commBadge');
  badge.textContent = open ? t.commOpen : t.commClosed;
  badge.className = 'badge ' + (open ? 'open' : 'closed');
  $('#commCta').href = `mailto:${CONFIG.email}?subject=${encodeURIComponent('Commission request — ' + CONFIG.artistName)}`;
  $('#commShop').href = `${CONFIG.shop}/collections/all`;
  $('#tiers').innerHTML = CONFIG.tiers.map(x => {
    const tt = t.tiers[x.key];
    const from = x.from ? `<span class="from">${t.fromPrefix}</span>` : '';
    const link = x.handle ? `${CONFIG.shop}/products/${x.handle}` : `${CONFIG.shop}/collections/all`;
    return `<a class="tier" href="${link}" target="_blank" rel="noopener">
      <h3>${tt.name}</h3>
      <span class="price">${from}<span class="n">${x.price}</span><span class="u">${x.unit || ''}</span></span>
      <p>${tt.desc}</p></a>`;
  }).join('');

  /* processo de comissão */
  $('#steps').innerHTML = t.steps.map(x =>
    `<li><span class="n">${x.n}</span><h4>${x.t}</h4><p>${x.d}</p></li>`).join('');

  /* contact */
  $('#mailLink').textContent = CONFIG.email;
  $('#mailLink').href = 'mailto:' + CONFIG.email;
  $('#cLinks').innerHTML =
    `<a href="${CONFIG.instagram}" target="_blank" rel="noopener">Instagram ↗</a>` +
    CONFIG.otherLinks.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join('');
  $('#footL').textContent = `© ${new Date().getFullYear()} ${CONFIG.artistName} · ${CONFIG.realName}`;

  observeReveals();
}

/* ---------- lightbox ---------- */
let lbIdx = 0;
const visibleIdxs = () => CONFIG.artworks.map((g,i) => i)
  .filter(i => activeCat === 'all' || CONFIG.artworks[i].cat === activeCat);
let lbOpener = null;
function openLb(i){
  lbOpener = document.activeElement;
  lbIdx = i; $('#lb').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#lbClose').focus(); drawLb();
}
function drawLb(){
  const g = CONFIG.artworks[lbIdx];
  const st = $('#lbStage'); st.innerHTML = ''; st.append(artEl(g, true));
  $('#lbCap').textContent = `${no(lbIdx)} — ${g.label}`;
}
function closeLb(){ $('#lb').classList.remove('open'); document.body.style.overflow = '';
  if(lbOpener && lbOpener.focus) lbOpener.focus(); }
function stepLb(d){
  const v = visibleIdxs(); if(!v.length) return;
  const pos = Math.max(0, v.indexOf(lbIdx));
  lbIdx = v[(pos + d + v.length) % v.length];
  drawLb();
}
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick  = () => stepLb(-1);
$('#lbNext').onclick  = () => stepLb(1);
$('#lb').onclick = e => { if(e.target === $('#lb')) closeLb(); };
addEventListener('keydown', e => {
  if(!$('#lb').classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'Tab'){                                  // o foco não escapa do lightbox
    const f = [...$('#lb').querySelectorAll('button')];
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
  if(e.key === 'ArrowLeft') stepLb(-1);
  if(e.key === 'ArrowRight') stepLb(1);
});


/* ---------- VFX ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* parallax suave da obra do hero, preso ao rAF para não travar o scroll */
if(!REDUCED){
  const shot = document.querySelector('.hero-art .shot');
  let ticking = false;
  addEventListener('scroll', () => {
    if(ticking || !shot) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = Math.min(scrollY, 700);
      shot.style.transform = `translateY(${y * -0.06}px)`;
      ticking = false;
    });
  }, {passive:true});
}

/* entrada escalonada: os elementos irmãos entram em cascata, não em bloco */
function stagger(sel, ms){
  document.querySelectorAll(sel).forEach((el,i) => {
    el.style.transitionDelay = REDUCED ? '0s' : (i % 8) * ms + 'ms';
  });
}

/* ---------- reveal on scroll ---------- */
let io;
function observeReveals(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.1});
  stagger('.frame', 60);
  stagger('.tier', 80);
  stagger('.steps li', 90);
  stagger('.proj', 100);
  $$('.rv').forEach(el => io.observe(el));
}

/* ---------- dados estruturados ----------
   O preco vivia em quatro sitios: CONFIG, Shopify, os Termos no Notion e este
   bloco JSON-LD. Agora o JSON-LD copia-se do CONFIG, por isso sao tres.
   Diz tambem ao Google se as comissoes estao abertas ou fechadas, o que sai
   directamente do commissionsOpen.                                          */
function syncStructuredData(){
  const el = $('#ldPerson');
  if(!el) return;
  let data;
  try { data = JSON.parse(el.textContent); } catch(e){ return; }
  const names = CONFIG.i18n.en.tiers;          // o schema fica sempre em EN
  data.makesOffer = CONFIG.tiers.map(x => ({
    "@type": "Offer",
    name: `${names[x.key] ? names[x.key].name : x.key} commission`,
    price: String(x.price),
    priceCurrency: "EUR",
    availability: CONFIG.commissionsOpen
      ? "https://schema.org/InStock"
      : "https://schema.org/OutOfStock",
  }));
  el.textContent = JSON.stringify(data, null, 2);
}

/* ---------- toggles ---------- */
$('#langTgl').onclick = () => { LANG = LANG === 'en' ? 'pt' : 'en'; renderText(); };
$('#themeTgl').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
};

/* ---------- boot ---------- */
renderHeroArt();
renderStrip();
renderText();
syncStructuredData();
</script>
