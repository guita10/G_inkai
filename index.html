/* 1 Nov 2026 (3): a paleta do Frede, tres cores: Midnight Black #030407,
   Electric Cobalt #1558C9 e Acid Lime #D8F454 (o codigo do lima estava
   cortado na imagem dele; #D8F454 e o medido na amostra, troca-se aqui). O
   site abre ESCURO: o preto e o fundo, e o tema claro fica no botao ◐. O
   cobalto substitui o Royal (no selo tambem) e o lima e o destaque.
   Papeis (medidos):
     --sky      o cobalto para PREENCHER (botoes, o selo, o ponto do percurso).
                Texto por cima e branco fixo, #FFFFFF: 6,42:1 nos dois temas.
                Como texto sobre o preto falha (3,19:1): no escuro nunca e
                texto.
     --sky-lift / --sky-raise  o cobalto como TEXTO pequeno (kickers, sitios,
                links): no escuro sobe de tom, #6E9BF2 (7,45 / 6,92 / 6,27:1
                sobre void / raise / raise-2); no claro e o proprio cobalto
                (5,83 / 6,42 / 5,23:1).
     --lime     o lima, so para PREENCHER, nos dois temas: o filtro activo, as
                etiquetas ABERTO e DROP, a seleccao. Texto por cima e o
                Midnight Black fixo, #030407: 16,58:1. Sobre o papel claro,
                como texto ou linha, desaparece (1,09:1): nunca.
     --hi       o destaque como LINHA ou TEXTO na pagina (o email, a marca da
                seccao actual, o ano que vem): lima no escuro (16,58:1),
                cobalto no claro (5,83:1).
   --bone 17,96:1 no escuro e 18,63:1 no claro; --bone-dim 7,81 e 6,20:1.
   Os nomes --sky* ficam do tempo do ceu. */
:root{
  color-scheme:dark;       /* barras de scroll e menus nativos no escuro */
  --void:#030407;         /* Midnight Black, o fundo */
  --raise:#0E1015;        /* os passe-partouts das obras e os cartoes */
  --raise-2:#181B21;
  --sky:#1558C9;          /* Electric Cobalt: preencher (texto por cima: #FFFFFF) */
  --sky-lift:#6E9BF2;     /* o cobalto como texto sobre --void */
  --sky-raise:#6E9BF2;    /* idem sobre --raise */
  --bone:#EEF0F3;         /* o texto */
  --bone-dim:#9BA0AA;
  --hair:rgba(238,240,243,.13);
  --lime:#D8F454;         /* Acid Lime: preencher (texto por cima: #030407) */
  --hi:#D8F454;           /* o destaque como linha ou texto */
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;
  --f-body:'Zen Kaku Gothic New',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ui:'Zen Kaku Gothic New',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* a margem lateral da pagina: uma so, em todo o lado */
  --pad:clamp(16px,3vw,40px);

     96 e 28px), e a segunda coluna de cada seccao comecava num x diferente.
     Com uma calha e as divisoes em doze avos (6/6, 5/7, 4/4/4), as colunas
     da abertura, do destaque, das comissoes e do sobre caem na mesma grelha. */
  --gut:clamp(24px,4vw,64px);
}

.bar{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
/* o selo 墨, o primeiro logotipo do site (Set 2026), de volta em Out 2026 (3):
   o caracter tirado da propria Shippori Mincho, branco no azul do site, num
   quadrado de cantos redondos. images/logo.svg, vectorial. width e height vao
   tambem no <img>, para a barra nao saltar enquanto ele carrega.
   Ver tools/make-logo.py */
.logo{width:34px;height:34px;flex:none;display:block}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:1.125rem;letter-spacing:0}
.links{font-family:var(--f-ui);display:flex;gap:26px;margin-left:auto;font-size:.875rem;font-weight:500}
/* padding vertical: a area de toque e do proprio link (44px ou mais) */
.links a{text-decoration:none;color:var(--bone-dim);transition:color .2s;position:relative;
  display:inline-block;padding:16px 0;min-height:calc(32px + 1.6em)}
/* O atributo hidden vale-se do display:none do browser, mas o inline-block de
   cima ganha-lhe. Sem isto, o link da loja com shopOpen:false ficava sem texto
   mas a ocupar espaco na barra. Vale para as duas copias (barra e painel). */
.links a[hidden],#navPanelLinks a[hidden],.btn[hidden]{display:none}
.links a:hover{color:var(--bone)}
.links a[aria-current]{color:var(--bone)}
.links a[aria-current]::after{
  content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;background:var(--hi);
}
.knobs{display:flex;gap:8px;margin-left:22px}

/* ---------- MENU MOVEL ----------
   Abaixo dos 621px os links da barra dao lugar a este botao. O painel fica em
   z-index 55, por baixo do cabecalho (60), de proposito: o proprio botao
   continua visivel e serve de fechar. */
.nav-toggle{display:none;padding:0;width:44px}
.nav-toggle .bars{position:relative;display:block;width:16px;height:11px;margin:0 auto}
.nav-toggle .bars::before,.nav-toggle .bars::after{
  content:"";position:absolute;left:0;width:16px;height:1px;background:currentColor;
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.nav-toggle .bars::before{top:3px}
.nav-toggle .bars::after{top:8px}
/* as duas barras juntam-se no mesmo y e cruzam-se: so transform, nada de top */
.nav-toggle[aria-expanded="true"] .bars::before{transform:translateY(2.5px) rotate(45deg)}
.nav-toggle[aria-expanded="true"] .bars::after{transform:translateY(-2.5px) rotate(-45deg)}

.nav-panel{display:none;position:fixed;inset:0;z-index:55;background:var(--void);
  padding:84px var(--pad) 40px;overflow-y:auto}
.nav-panel.open{display:block}
.nav-panel nav{display:flex;flex-direction:column}
.nav-panel a{
  font-family:var(--f-disp);font-weight:700;font-size:clamp(1.7rem,8vw,2.4rem);
  color:var(--bone-dim);text-decoration:none;padding:14px 0;
  border-bottom:1px solid var(--hair);
  opacity:0;transform:translateY(14px);
  transition:opacity .3s cubic-bezier(.2,.7,.3,1),transform .3s cubic-bezier(.2,.7,.3,1),color .2s ease;
}
.nav-panel.open a{opacity:1;transform:none}
/* cascata: .3s com 30ms entre links, tudo no sitio por volta dos .45s */
.nav-panel.open a:nth-child(1){transition-delay:.03s}
.nav-panel.open a:nth-child(2){transition-delay:.06s}
.nav-panel.open a:nth-child(3){transition-delay:.09s}
.nav-panel.open a:nth-child(4){transition-delay:.12s}
.nav-panel.open a:nth-child(5){transition-delay:.15s}
.nav-panel.open a:nth-child(6){transition-delay:.18s}
.nav-panel a:hover{color:var(--bone)}
.nav-panel a[aria-current]{color:var(--hi)}

/* texto so para leitores de ecra */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.knob{
  /* 44px: o alvo de toque minimo */
  height:44px;min-width:44px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--hair);background:transparent;color:var(--bone-dim);
  /* o atalho `font:` define TAMBEM a familia: um glifo sem ela cai no Arial */
  font:500 .75rem/1 var(--f-ui);letter-spacing:.1em;
  transition:border-color .2s ease,color .2s ease,transform .12s ease-out;
}
.knob:hover{border-color:var(--bone);color:var(--bone)}

/* ================= BUTTONS ================= */
.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;
  font:500 .875rem/20px var(--f-ui);letter-spacing:.01em;padding:13px 24px;border-radius:2px;
  /* 44px: a altura com o rotulo la dentro (vazio tinha 28 e crescia quando o
     JS escrevia o texto) e o alvo tactil minimo, as duas coisas. A
     entrelinha em px (20, 48px no total): com "normal" o botao tinha 44px
     com a letra de reserva e 48 com o Zen, e crescia 4px quando ela chegava. */
  min-height:44px;
  border:1px solid var(--bone);color:var(--bone);background:transparent;
  transition:background .25s ease,border-color .25s ease,color .25s ease,transform .12s ease-out;
}
.btn:hover{background:var(--bone);color:var(--void)}
/* o cheio e azul e, no hover, passa a tinta: nunca fica oco */
.btn.fill{background:var(--sky);border-color:var(--sky);color:#FFFFFF}   /* branco no cobalto: 6,42:1 */
.btn.fill:hover{background:var(--bone);border-color:var(--bone);color:var(--void)}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* ================= A ABERTURA =================
   1 Nov 2026 (2): o nome e uma obra. O topo era uma faixa de texto com um
   titulo generico ("Ilustracao e design de personagens"), o nome so em letra
   pequena e a arte a comecar a meio do ecra. Agora, como um cartaz: o nome
   grande em cima a esquerda, a frase, os botoes e duas provas em baixo; a
   direita uma original do Frede, inteira, da altura do ecra, outra a cada
   visita (CONFIG.heroArt). A parede vem a seguir.
   Duas colunas iguais (6/12 e 6/12, a mesma calha do resto do site).
   1 Nov 2026 (4): "Flip", escolhido pelo Frede entre quatro prototipos (o
   /prototype das skills do Emil). Por baixo da frase ficam as seis
   originais em molduras pequenas: apontar, focar ou tocar numa troca a obra
   grande, na hora. As provas subiram para baixo dos botoes. */
/* A largura da obra (--art-w): a coluna, ou o que a altura do ecra deixa
   (menos a barra de 73px, o espaco de cima e de baixo e a legenda, ~185),
   o que for menor, nunca abaixo de 300px. A abertura guarda a altura da obra
   no min-height: numa ligacao lenta o browser pintava, uma vez em cada duas,
   antes de ler a <figure>; a grelha ficava da altura do texto, a frase e os
   botoes logo abaixo do nome, e desciam 240px quando a obra chegava (CLS,
   1 Nov 2026). */
.hero{--pt:clamp(24px,3vw,40px);--pb:clamp(40px,4vw,56px);
  --art-w:min((min(1400px,100vw) - 2 * var(--pad) - var(--gut)) / 2, max(300px, (100vh - 185px) * .8));
  --art-w:min((min(1400px,100vw) - 2 * var(--pad) - var(--gut)) / 2, max(300px, (100svh - 185px) * .8));
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto 1fr calc(24px + 70px);grid-template-areas:"nome arte" "info arte" "mini arte";
  column-gap:var(--gut);padding:var(--pt) 0 var(--pb);
  min-height:calc(var(--art-w) * 1.25 + var(--pt) + var(--pb))}
/* O nome numa linha, sempre: "Guita_Ink" nao tem espacos, por isso nunca
   parte, e o tamanho segue a largura da coluna (o nome mede 4,83em na
   mincho; dividir a coluna por 5,1 deixa ~5% de folga). E o unico tipo
   acima do degrau dos 70px, de proposito: e o nome. Escrito logo pelo
   script da abertura, nao pelo do fim, por isso nao precisa de reserva. */
.hero h1{grid-area:nome;align-self:start}
.hero h1 .nm{display:block;
  font-size:min(7.5rem, calc((min(1400px,100vw) - 2 * var(--pad) - var(--gut)) / 10.2));
  line-height:1;letter-spacing:-.02em;white-space:nowrap;margin-top:-.08em;min-height:1em}
/* o que faz, logo por baixo do nome, no degrau dos titulos de seccao: e a
   primeira pergunta de quem chega a pagina de uma pessoa ("quem e, o que
   faz"). Sempre duas linhas: o max-width de 11em nao deixa caber numa, e
   nenhuma metade passa de 11em (o PT "Ilustracao e design / de personagens"
   e o mais comprido). Vem do JS no fim, por isso as duas linhas ficam
   reservadas (2,16em). O verify varre isto de 320 a 1600px nas duas linguas. */
.hero h1 .role{display:block;font-size:clamp(1.5rem,3.2vw,2.8rem);line-height:1.08;letter-spacing:-.015em;
  max-width:11em;min-height:2.16em;margin-top:.45em}
/* A frase, os botoes e as provas: o bloco assenta no fundo da sua fila e
   guarda a altura toda (24 de ar, a frase em duas linhas, 24, o botao de 48,
   20, as provas em duas linhas). Sem isto, numa ligacao lenta o browser
   pintava depois de ler so a frase; os botoes e as provas chegavam a seguir
   e, como o bloco assenta no fundo, empurravam a frase 119px para cima
   (CLS, uma carga em tres, 1 Nov 2026). */
.hero-info{grid-area:info;align-self:end;padding-top:24px;
  min-height:calc(24px + 3.2 * 1.125rem + 24px + 48px + 20px + 3.2rem)}
.hero .tag{font-size:1.125rem;line-height:1.6;margin-bottom:24px;min-height:3.2em;max-width:32rem}
/* duas provas, as duas tiradas da copia que ja existia (o percurso e a bio):
   o concurso e a capa de todos os meses. Desde o Flip ficam por baixo dos
   botoes, com as duas linhas reservadas (chegam do JS no fim). */
.hero-prova{list-style:none;min-height:3.2em;margin-top:20px;
  font-size:1rem;line-height:1.6;color:var(--bone-dim)}
/* As seis molduras pequenas (o Flip). A fila tem altura FIXA na grelha
   (24px de ar e 70 de moldura), e nao auto: numa ligacao lenta o browser
   pinta antes de o script do fim as desenhar, e uma fila que nascesse com
   zero subia a frase e os botoes quando elas chegassem (foi o que as provas
   fizeram, 87px, antes de terem esta fila: CLS, 1 Nov 2026).
   Molduras sem raio, como as da parede; a escolhida leva o contorno do
   destaque (--hi: lima a noite, cobalto de dia; o lima no claro desaparece). */
.hero-mini{grid-area:mini;align-self:end;display:flex;gap:10px}
.mini{flex:none;width:min(56px, calc((100% - 50px) / 6));aspect-ratio:4/5;padding:3px;border:0;border-radius:0;
  background:var(--raise);cursor:pointer;outline:2px solid transparent;outline-offset:3px;
  transition:outline-color .15s ease,transform .12s ease-out}
.mini img{width:100%;height:100%;object-fit:contain}
.mini:hover{outline-color:var(--hair)}
.mini[aria-pressed="true"]{outline-color:var(--hi)}
.mini:focus-visible{outline-color:var(--sky-lift)}
/* A obra: 4:5 no passe-partout de 4%, como na parede. A largura sai da
   altura do ecra (menos a barra de 73px, o espaco de cima e de baixo, ~112),
   para caber inteira no primeiro ecra, e nunca passa da coluna. Encostada a
   direita, a margem da pagina. A legenda fica pendurada por baixo, no
   espaco de baixo da abertura, para a base da obra alinhar com as provas. */
.hero-art{grid-area:arte;justify-self:end;align-self:start;position:relative;margin:0;cursor:zoom-in;
  width:min(100%, var(--art-w))}
.hero-art .mat{display:block;aspect-ratio:4/5;padding:4%;background:var(--raise);overflow:hidden}
.hero-art picture{display:block;width:100%;height:100%}
.hero-art img{width:100%;height:100%;object-fit:contain;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.hero-art:hover img{transform:scale(1.02)}
.hero-art:focus-visible{outline:2px solid var(--sky-lift);outline-offset:3px}
/* a legenda: o titulo a esquerda, "3 / 6" a direita */
.hero-cap{position:absolute;left:0;right:0;top:100%;padding-top:10px;font-family:var(--f-ui);
  font-size:.875rem;color:var(--bone-dim);white-space:nowrap;display:flex;justify-content:space-between;gap:12px;
  font-variant-numeric:tabular-nums}

/* ================= SECTIONS ================= */
/* sem fios entre seccoes: separam-se pelo espaco e pelo titulo */
section{padding:clamp(64px,9vw,128px) 0 0}
.head{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:clamp(26px,3.6vw,44px)}
.count{font-family:var(--f-ui);font-size:.875rem;color:var(--bone-dim);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ================= A PAREDE =================
   Desde 1 Nov 2026 (2) a abertura ocupa o primeiro ecra (o nome e uma
   obra), por isso a parede leva o espaco normal de seccao. Na barra de cima
   o titulo, os filtros e a contagem, numa linha no desktop. */
.wall-bar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 28px;margin-bottom:18px}
/* os filtros sao escritos pelo JS e estao no primeiro ecra: a altura de uma
   fila de botoes fica reservada (duas filas no telemovel, mais abaixo) */
.filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-height:38px;align-items:center}
.chip{
  font:500 .875rem var(--f-ui);letter-spacing:.01em;padding:8px 16px;border-radius:999px;
  cursor:pointer;border:1px solid var(--hair);background:transparent;color:var(--bone-dim);
  transition:background .2s ease,border-color .2s ease,color .2s ease,transform .12s ease-out;
}
.chip:hover{color:var(--bone);border-color:var(--bone)}
/* o filtro activo e o destaque: lima, preto por cima (16,58:1) */
.chip.on{background:var(--lime);border-color:var(--lime);color:#030407}
/* GRELHA UNIFORME: todas as molduras 4:5, em filas. Tres colunas no desktop
   (eram quatro: obra maior), duas no tablet e no telemovel.
   A REGRA NAO MUDA: nenhuma obra e cortada. O object-fit e contain, nunca
   cover: uma peca quadrada fica inteira, com papel branco por cima e por
   baixo, como um passe-partout. O verify mede isto em cada peca. */
.wall{--cols:3;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:12px}
/* A altura reservada antes de o JS correr: filas vezes a altura de uma
   moldura (1,25 vezes a largura de uma coluna) mais os espacos entre filas.
   --wall-rows e GERADO pelo tools/dims.py, a partir do numero de pecas que a
   parede mostra ao abrir (wallPreview). Nao o escrevas a mao — muda a parede
   e corre o script. --wall-w e a largura do .wrap sem as margens. */
.wall{
  --wall-w:calc(min(1400px,100vw) - 2 * var(--pad));
  --wall-rows:4;
  min-height:calc(var(--wall-rows) * 1.25 * (var(--wall-w) - (var(--cols) - 1) * 12px) / var(--cols) + (var(--wall-rows) - 1) * 12px);
}
/* O passe-partout (1 Nov 2026): uma margem igual a toda a volta, 4% da
   largura da moldura. Antes a obra 4:5 ia ate a borda da moldura e so as
   quadradas e as largas tinham papel a volta, por isso umas pareciam
   emolduradas e outras nao, e entre duas obras 4:5 ficavam so os 12px da
   grelha. Agora todas assentam no mesmo papel. O padding em % conta da
   largura, por isso e igual nos quatro lados; com o box-sizing a moldura
   continua 4:5 por fora, e a reserva da parede nao muda. */
.frame{
  display:block;width:100%;margin:0;padding:4%;
  cursor:zoom-in;position:relative;
  background:var(--raise);overflow:hidden;
  aspect-ratio:4/5;
}
.frame:focus-visible{outline:2px solid var(--sky-lift);outline-offset:3px}
/* contain e nao cover: a obra entra inteira na moldura, nunca cortada. No
   hover cresce 2% dentro da moldura (so transform), o unico gesto por cima
   da obra. */
.frame img,.frame .ph{width:100%;height:100%;object-fit:contain}
.frame img{transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.frame:hover img{transform:scale(1.02)}
.lb-stage img{width:auto;height:auto}
/* A legenda: uma faixa de tinta que sobe por baixo da obra no hover. Fundo
   opaco e cores fixas (#030407 / #EEF0F3, 17,96:1), iguais nos dois temas: por
   tras esta a obra, nao a pagina. Sem veu degrade, o teste de contraste do
   verify consegue medi-la como qualquer texto. Num ecra de toque nao ha
   hover: o titulo aparece ao abrir a obra. */
.frame .meta{
  position:absolute;left:0;right:0;bottom:0;padding:10px 14px;
  background:#030407;color:#EEF0F3;
  transform:translateY(101%);transition:transform .25s cubic-bezier(.2,.7,.3,1);
}
.frame:hover .meta,.frame:focus-visible .meta{transform:none}
.frame .meta .t{font-family:var(--f-disp);font-weight:700;font-size:1rem;line-height:1.3}
.frame.hidden{display:none}
/* Nada encontrado com este filtro. Antes a parede ficava simplesmente vazia. */
.wall-empty{display:none;padding:40px 0;color:var(--bone-dim);font-size:1rem}
.wall-empty.on{display:block}
/* o botao que abre a parede toda, ao centro */
.wall-more{display:flex;justify-content:center;padding-top:32px}
.wall-more[hidden]{display:none}

/* placeholder: so aparece se uma obra faltar no disco */
.ph{
  display:grid;place-content:center;text-align:center;gap:6px;padding:18px;
  background:repeating-linear-gradient(-45deg,transparent 0 12px,color-mix(in srgb,var(--sky) 10%,transparent) 12px 13px),var(--raise-2);
  color:var(--bone-dim);
}
.ph b{font-family:var(--f-disp);font-weight:700;font-size:1rem;color:var(--bone);line-height:1.1}
.ph span{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.r-34{aspect-ratio:3/4}.r-12{aspect-ratio:1/2}.r-11{aspect-ratio:1/1}.r-43{aspect-ratio:4/3}

/* ================= PROJECTS =================
   Depois da parede (antes vinham primeiro). O projecto em destaque
   (CONFIG.featured) a largura toda: a capa a esquerda, grande, e a direita o
   texto, a tira das pecas da serie e os links. Os outros numa fila de tres por
   baixo. Sem caixas: cada cartao e a capa no seu passe-partout e o texto no
   papel. */
.proj-feat{margin-bottom:clamp(40px,5vw,64px)}
.proj-feat[hidden]{display:none}
.pf{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--gut);align-items:center}
/* o mesmo passe-partout da parede (4%) */
.pf-art{display:block;background:var(--raise);padding:4%}
.pf-art img{width:100%;height:auto;display:block}
.pf-body{display:flex;flex-direction:column;gap:20px}
.pf .k,.proj .k{font-family:var(--f-ui);font-size:.875rem;font-weight:500;color:var(--sky-raise)}
/* o titulo do destaque no degrau dos titulos de seccao: estava maior do que
   o proprio "Projetos em destaque" por cima dele (51 contra 45px) */
.pf h3{font-size:clamp(1.8rem,3.2vw,2.8rem);line-height:1.08}
.pf h3 a{text-decoration:none}
.pf p{color:var(--bone);max-width:34rem;font-size:1.125rem}
.pf-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:4px}
.pf-strip img{width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;background:var(--raise)}
.pf-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gut);align-items:stretch}
.proj{
  text-decoration:none;color:inherit;display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.proj:hover{transform:translateY(-4px)}
.proj .body{padding:20px 0 0;display:flex;flex-direction:column;gap:10px;flex:1}
/* as tres capas com a mesma altura, a capa inteira la dentro (contain), sobre
   o passe-partout. Nunca se corta; os titulos ficam alinhados.
   1 Nov 2026: a caixa era quase quadrada (uma altura fixa) e duas das tres
   capas sao altas, por isso enchiam 68% e 73% dela. Agora e 4:5, como as
   molduras da parede (enchem 84 a 89%), com o mesmo passe-partout de 4%. As
   tres colunas tem a mesma largura, por isso a mesma altura. */
.proj > img{width:100%;height:auto;aspect-ratio:4/5;padding:4%;object-fit:contain;background:var(--raise)}
.plate{
  display:grid;place-items:center;background:var(--raise-2);position:relative;overflow:hidden;
}
.plate::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--sky) 1px,transparent 1.4px);background-size:14px 14px;opacity:.16;
}
.plate span{font-family:var(--f-disp);font-weight:700;font-size:clamp(2.6rem,7vw,4rem);color:var(--sky-lift);z-index:1}
.proj h3{font-size:1.5rem}
.proj p{font-size:1rem;color:var(--bone)}
.proj .go{margin-top:auto;padding-top:10px;font-size:.875rem;font-weight:500;color:var(--bone)}
.proj:hover .go{color:var(--sky-lift)}

/* ================= COMMISSIONS =================
   O texto, os botoes e os quatro formatos a esquerda; a direita o elenco dos
   sete (Survival of Kings, original do Frede), que e o que se encomenda:
   personagens. Os formatos, a nota e o pedido estao no loja.html. */
.badge{font-family:var(--f-ui);font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.badge.open{background:var(--lime);color:#030407}   /* o lima, preto por cima: 16,58:1 */
.badge.closed{border:1px solid var(--hair);color:var(--bone-dim)}
#comm .head{flex-direction:row;align-items:center;gap:16px}
.comm-band{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--gut);align-items:center}
/* linhas, nao caixas: cada formato numa linha de cabelo */
.comm-formats{list-style:none;border-top:1px solid var(--hair);margin-top:34px}
.comm-formats li{padding:16px 0;border-bottom:1px solid var(--hair);font-family:var(--f-disp);font-weight:700;font-size:1.5rem;line-height:1.2}
/* o elenco: decoracao (um fundo, nao um <img>), o aspect-ratio guarda o lugar */
.comm-art{aspect-ratio:5424/2778;
  background:url("images/bg/cast-cut-1000.png") center/contain no-repeat;
  background:image-set(url("images/bg/cast-cut-1920.webp") type("image/webp"),url("images/bg/cast-cut-1000.png") type("image/png")) center/contain no-repeat}

/* ================= ABOUT ================= */
/* a bio a esquerda, o percurso a direita; start porque as duas colunas tem
   alturas muito diferentes */
/* 1 Nov 2026: 5/12 e 7/12, como o destaque e as comissoes (era meio a meio),
   por isso o percurso comeca no mesmo x que o texto do destaque e o elenco.
   A bio a 18px numa coluna de 5/12 tem ~58 caracteres por linha; o max-width
   segura-a quando a seccao passa a uma coluna (no tablet tinha ~85). */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--gut);align-items:start}
.about .body{font-size:1.125rem;line-height:1.6;max-width:36rem}
.about .body p + p{margin-top:.9em}
/* A bio e a unica caixa de texto sem altura reservada, de proposito: muda
   muito de altura com a largura da coluna, e a seccao fica bem abaixo da
   dobra, onde o JS ja correu muito antes de alguem la chegar. */
.about .meta{margin-top:22px;font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim)}
.about-tl-title{font-family:var(--f-ui);font-size:.75rem;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-dim);margin-bottom:26px}

/* ================= TIMELINE ================= */
/* os anos no degrau dos subtitulos (24px): a 40px competiam com o "Sobre"
   ao lado, a 45 */
.tl{display:grid;grid-template-columns:clamp(68px,7vw,96px) 1fr}
/* o ano alinha com o ponto do primeiro item do grupo (o ponto esta a 6px do
   topo; o ano a 24px com entrelinha 1 tem o centro ai perto). Os 16px de
   cima eram dos anos a 40px e desalinhavam-nos com 24. */
.tl-year{
  font-family:var(--f-disp);font-weight:700;font-size:1.5rem;text-align:right;
  padding:0 22px 0 0;color:var(--bone);opacity:.4;transition:opacity .3s;
  line-height:1;letter-spacing:-.01em;
}
.tl-year.has-next{opacity:1;color:var(--hi)}
.tl-item{position:relative;padding:0 0 32px 26px;border-left:1px solid var(--hair)}
.tl-item:last-child{border-left-color:transparent}
.tl-item:last-child::after{content:"";position:absolute;left:-1px;top:0;height:28px;width:1px;background:var(--hair)}
.tl-dot{position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:999px;background:var(--bone-dim)}
.tl-item.next .tl-dot{background:var(--sky)}
.tl-item.next{border-left-style:dashed;border-left-color:var(--sky)}
.tl-when{font-family:var(--f-ui);font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tl-flag{font-family:var(--f-ui);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#030407;background:var(--lime);padding:3px 9px;border-radius:999px}
.tl-item h3{font-size:1.5rem;margin:10px 0 6px}
.tl-where{font-size:.875rem;font-weight:500;color:var(--sky-lift);margin-bottom:6px}
.tl-desc{font-size:1rem;color:var(--bone);max-width:42rem}

/* ================= CONTACT ================= */
.mail-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:26px}
.btn-sm{padding:9px 15px;font-size:.875rem;min-height:40px}
.mail{
  /* 70px no desktop (o degrau do titulo da abertura) e ~29px num telemovel
     de 390 (o dos titulos de seccao); aos 320px cabe numa linha */
  font-family:var(--f-disp);font-weight:700;font-size:clamp(1.5rem,7.4vw,4.4rem);text-decoration:none;
  color:var(--hi);display:inline-block;transition:color .25s;line-height:1.1;letter-spacing:-.02em;
  overflow-wrap:anywhere;
}
.mail:hover{color:var(--bone)}
.c-links{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px;font-size:.875rem;font-weight:500}
.c-links a{font-family:var(--f-ui);color:var(--bone-dim);text-decoration:none;transition:color .2s}
.c-links a:hover{color:var(--bone)}
footer{font-family:var(--f-ui);margin-top:clamp(64px,9vw,128px);
  padding:24px 0 44px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:.875rem;color:var(--bone-dim);
}

/* ================= LIGHTBOX ================= */
.lb{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:5vh 5vw;background:rgba(3,4,7,.96);backdrop-filter:blur(8px)}
.lb.open{display:grid}
/* abre com 180ms de fade e a obra cresce de .98, fecha em 120ms. O
   @starting-style so dispara quando a lightbox passa de escondida a visivel:
   trocar de obra com as setas nao anima, de proposito. */
.lb{opacity:0;transition:opacity .12s ease,display .12s allow-discrete}
.lb.open{opacity:1;transition:opacity .18s cubic-bezier(.2,.7,.3,1),display .18s allow-discrete}
@starting-style{.lb.open{opacity:0}}
.lb-stage{transition:transform .18s cubic-bezier(.2,.7,.3,1)}
@starting-style{.lb.open .lb-stage{transform:scale(.98)}}
.lb-stage{max-width:min(92vw,900px);max-height:78vh;display:grid;place-items:center}
.lb-stage img,.lb-stage .ph{max-height:74vh}
.lb-stage .ph{width:min(70vw,440px)}
/* O fundo da lightbox e escuro nos DOIS temas, porque por baixo esta a obra
   e nao a pagina: as cores do texto sao fixas (17,96:1 e 7,81:1 sobre o #030407). */
.lb-cap{color:#EEF0F3;font-size:1rem;margin-top:16px;text-align:center;font-family:var(--f-disp);font-weight:700}
.lb-pos{font-family:var(--f-ui);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;
  color:#9BA0AA;text-align:center;margin-top:7px;font-variant-numeric:tabular-nums}
.lb-hint{color:#9BA0AA;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;text-align:center}
.lb-btn{position:fixed;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;cursor:pointer;width:44px;height:44px;border-radius:999px;
  font:400 1.2rem var(--f-ui);   /* idem: sem isto era Arial */
  transition:background .2s ease,border-color .2s ease,color .2s ease,transform .12s ease-out}
.lb-btn:hover{background:#EEF0F3;border-color:#EEF0F3;color:#030407}
.lb-close{top:22px;right:22px}

/* Resposta ao carregar: 0,97 em 120ms. A .frame fica de fora (num telemovel
   rolar a parede comeca com um toque nela). As setas ja usam translateY(-50%)
   para se centrarem, por isso repetem-no. */
.btn:active,.chip:active,.knob:active,.lb-close:active,.mini:active{transform:scale(.97)}
.lb-prev:active,.lb-next:active{transform:translateY(-50%) scale(.97)}
.lb-prev{left:18px;top:50%;transform:translateY(-50%)}
.lb-next{right:18px;top:50%;transform:translateY(-50%)}


/* ================= VFX ================= */
/* Poucos, de proposito: a obra e que mexe. A trama que varria as obras e as
   linhas de velocidade do ceu sairam com o redesenho "a obra primeiro". */

/* 1. TINTA — os titulos revelam-se como tinta a espalhar-se no papel */
.sec-title.rv{opacity:1;transform:none}   /* o reveal do titulo e o clip-path, nao o fade */
.sec-title{
  clip-path:inset(0 100% 0 0);
  transition:clip-path 1.1s cubic-bezier(.16,.84,.36,1);
}
/* quem dispara e o .head (que e .rv e nao esta cortado): o IntersectionObserver
   do Chromium conta o clip-path, e um titulo cortado a zero nunca "entrava". */
.sec-title.in,
.head.in .sec-title{clip-path:inset(0 0 0 0)}

/* 2. BRILHO — atravessa os botoes cheios (so transform) */
.btn.fill{position:relative;overflow:hidden}
.btn.fill::after{
  content:"";position:absolute;top:0;left:0;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-200%);
  transition:transform .65s ease;
}
.btn.fill:hover::after{transform:translateX(217%)}

/* 3. SELO — o 墨 assenta ao carregar, como um carimbo (a curva com ressalto
   e so dele; foi para ele que nasceu, em Setembro) */
.logo{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{
  from{transform:scale(1.5) rotate(-14deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

/* 4. PONTO — o marcador do percurso pulsa quando entra em cena */
.tl-item.in .tl-dot{animation:ping .9s ease-out}
@keyframes ping{
  0%{box-shadow:0 0 0 0 var(--sky)}
  100%{box-shadow:0 0 0 12px transparent}
}

/* 5. TOQUE — num ecra de toque o :hover fica preso depois do toque. Os hovers
   que mexem ficam desligados (o cartao que sobe, a obra que cresce, o
   brilho) e o botao cheio nao muda de cor. Depois das regras que anula. */
@media (hover:none){
  .proj:hover{transform:none}
  .frame:hover img,.hero-art:hover img{transform:none}
  .btn.fill:hover::after{transform:translateX(-200%)}
  .btn.fill:hover{background:var(--sky);color:#FFFFFF;border-color:var(--sky)}
}

/* Respeitar quem pediu menos movimento — desliga tudo isto */
@media (prefers-reduced-motion:reduce){
  .sec-title{clip-path:none;transition:none}
  .btn.fill::after{display:none}
  .logo{animation:none;opacity:1;transform:none}
  .tl-item.in .tl-dot{animation:none}
}

/* ================= MOTION ================= */
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .proj,.btn,.mail,.knob,.chip,.lb-btn{transition:none}
  .frame img,.frame .meta,.hero-art img,.mini{transition:none}
  .links a,.c-links a{transition:none}
  .tl-year{transition:none}
  body{transition:none}
  .nav-panel a{transition:none;opacity:1;transform:none}
  /* :nth-child(n) para igualar a especificidade das regras da cascata */
  .nav-panel.open a:nth-child(n){transition-delay:0s}
  .nav-toggle .bars::before,.nav-toggle .bars::after{transition:none}
  .btn:active,.chip:active,.knob:active,.lb-close:active,.mini:active{transform:none}
  .lb-prev:active,.lb-next:active{transform:translateY(-50%)}
  /* a lightbox abre e fecha de uma vez, sem fade nem crescer */
  .lb,.lb.open,.lb-stage{transition:none}
}

/* ================= RESPONSIVE ================= */
@media (max-width:980px){
  .wall{--cols:2;--wall-rows:6}
  /* tablet: a abertura continua em duas colunas, mais estreitas. A frase
     parte em tres linhas (reserva de tres) e as provas descem para 14px,
     para cada uma caber numa linha ate aos 621px. */
  .hero .tag{min-height:4.8em}
  .hero{grid-template-rows:auto 1fr calc(20px + 70px)}
  .hero-info{min-height:calc(24px + 4.8 * 1.125rem + 24px + 48px + 20px + 3.2 * .875rem)}
  .hero-prova{font-size:.875rem}
  /* o titulo da parede numa linha, os filtros e a contagem na seguinte */
  .wall-bar{gap:12px 16px}
  .wall-bar .sec-title{flex-basis:100%}
  .pf{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
  .pf-strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .about{grid-template-columns:minmax(0,1fr);gap:48px}
  .comm-band{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  /* Em telemovel os projectos empilham, um por linha, cada capa a largura da
     pagina (1 Nov 2026). Eram uma fila que se arrastava de lado e saia ate a
     borda do ecra: o cartao seguinte aparecia cortado a 0px, com o texto
     encostado a borda, e lia-se como cortado e nao como "arrasta". */
  .projects{grid-template-columns:minmax(0,1fr);gap:48px}
  .pf{grid-template-columns:minmax(0,1fr)}
  /* a barra aos 320px: o "Guita_Ink" na mincho e mais largo do que era, e
     com as folgas de antes o ultimo botao saia 4px do ecra (o verify apanhou-o).
     O selo desce para 30px, o nome e as folgas apertam; os botoes guardam os
     44px de alvo de toque. */
  /* a abertura empilha: o nome, a frase e os botoes, a obra, as provas. O
     nome segue a largura da pagina inteira; a legenda volta ao fluxo, por
     baixo da obra. A frase volta a reserva de duas linhas: abaixo de 380px
     tem tres, como sempre teve. */
  /* sem min-height: empilhada, a obra vem depois do texto e, se chegar
     tarde, aparece por baixo sem empurrar nada */
  .hero{grid-template-columns:minmax(0,1fr);grid-template-rows:none;
    grid-template-areas:"nome" "info" "arte" "mini";padding-top:24px;min-height:0}
  .hero h1 .nm{font-size:min(7.5rem, calc((100vw - 2 * var(--pad)) / 5.1))}
  .hero-info{padding-top:20px;min-height:calc(20px + 3.2 * 1.125rem + 24px + 48px + 20px + 3.2rem)}
  .hero .tag{min-height:3.2em}
  .hero-art{justify-self:start;width:100%;margin-top:32px}
  .hero-cap{position:static}
  .hero-prova{font-size:1rem}
  /* as seis molduras repartem a largura; a fila guarda a altura delas */
  .hero-mini{margin-top:16px;gap:8px;min-height:calc((100vw - 2 * var(--pad) - 40px) / 6 * 1.25)}
  .mini{width:calc((100% - 40px) / 6)}
  .bar{min-height:64px;gap:12px}
  .logo{width:30px;height:30px}
  .brand{gap:10px}
  .brand b{font-size:1rem}
  .knobs{gap:6px}
  .wall{--cols:2;--wall-rows:6}
  /* duas filas de botoes no telemovel */
  .filters{min-height:84px;align-content:flex-start}
  .links{display:none}
  .knobs{margin-left:auto}
  .nav-toggle{display:block}
  .tl{grid-template-columns:minmax(0,1fr)}
  .tl-year{text-align:left;padding:20px 0 10px}
  .tl-year:first-child{padding-top:0}
}
/* Faixa dos tablets. Os links do menu reaparecem aos 621px, mas a barra
   completa pede ~744px. Os links apertam em vez de desaparecerem. */
@media (min-width:621px) and (max-width:780px){
  .bar{gap:12px;min-height:71px}
  .links{gap:clamp(8px,1.4vw,14px);font-size:.75rem}
  .knobs{margin-left:12px}
}
</style>
</head>

     a pagina ficaria completamente vazia — isto garante que pelo menos o nome
     e o contacto aparecem sempre. -->

<header>
  <div class="wrap bar">

      <img class="logo" src="images/logo.svg" alt="" width="36" height="36">
      <b id="brandName"></b>
    </a>

      <a href="#work"     data-t="navWork"></a>
      <!-- data-shop-link e nao um id: o painel do menu movel clona estes
           links com cloneNode(true), que copia o id tal e qual. Com id havia
           dois elementos #navShop no documento, o querySelector so apanhava um
           e o outro ficava com a visibilidade trocada. O atributo permite
           tratar as duas copias de uma vez. -->
      <a href="loja.html" data-loja="" data-t="navShop" data-shop-link hidden></a>

        <span class="bars" aria-hidden="true"></span>

<!-- Painel do menu movel. Os links sao clonados do <nav class="links"> pelo JS,
     para nao haver duas listas para manter em sincronia. -->
<div class="nav-panel" id="navPanel">
  <nav id="navPanelLinks"></nav>
</div>

<main id="top">
<div class="wrap">

  <!-- A ABERTURA (1 Nov 2026 (2)): o nome e uma obra. O nome e a obra sao
       escritos pelo script logo a seguir (nao pelo do fim do ficheiro), para
       o browser pedir a imagem enquanto ainda le a pagina. -->
  <div class="hero">
    <h1><span class="nm" id="heroName"></span> <span class="role" data-t="heroRole"></span></h1>
    <div class="hero-info">
      <p class="tag" data-t="tagline"></p>
      <div class="row">
        <a class="btn fill" href="#work"><span data-t="ctaWork"></span> →</a>
        <a class="btn" href="loja.html#comissoes" data-loja="#comissoes"><span data-t="ctaComm"></span></a>
      </div>
      <ul class="hero-prova">
        <li data-t="proofContest"></li>
        <li data-t="proofCovers"></li>
      </ul>
    </div>
    <figure class="hero-art" id="heroArt" role="button" tabindex="0">
      <span class="mat"><picture><source id="heroWebp" type="image/webp"><img id="heroImg" width="1280" height="1600" alt="" fetchpriority="high" decoding="async"></picture></span>
      <figcaption class="hero-cap"><span id="heroCap"></span><span id="heroPos"></span></figcaption>
    </figure>
    <!-- as seis originais em pequeno (o Flip): desenhadas pelo script do fim,
         que tem as palavras nas duas linguas; a fila ja tem a altura delas -->
    <div class="hero-mini" id="heroMini" role="group"></div>
    <script>
    /* A obra do topo: uma das originais do CONFIG.heroArt, outra a cada
       visita (a seguinte da lista; a primeira visita tira a sorte). Corre
       aqui e nao no fim: a imagem e a maior coisa do primeiro ecra, e assim
       o pedido sai logo. Fica DEPOIS de toda a marcacao da abertura, de
       proposito: numa ligacao lenta o browser pinta antes de correr um
       script, e as provas, que estavam depois dele, chegavam mais tarde e
       subiam a frase e os botoes 87px (CLS, 1 Nov 2026). Se o localStorage
       falhar (janela privada), tira a sorte sempre. O clique abre-a na
       lightbox, e as molduras pequenas trocam-na (ver o script do fim). */
    (function(){
      document.getElementById('heroName').textContent = CONFIG.artistName;
      var fig = document.getElementById('heroArt');
      var lista = (CONFIG.heroArt || []).map(function(src){
        for(var j = 0; j < CONFIG.artworks.length; j++) if(CONFIG.artworks[j].src === src) return j;
        return -1; }).filter(function(j){ return j >= 0; });
      if(!lista.length){ fig.hidden = true; return; }
      var k = Math.floor(Math.random() * lista.length);
      try {
        var ult = localStorage.getItem('gi-hero');
        if(ult !== null && +ult >= 0) k = (+ult + 1) % lista.length;
        localStorage.setItem('gi-hero', String(k));
      } catch(e){}
      var g = CONFIG.artworks[lista[k]], base = CONFIG.imageBase || '';
      var full = base + g.src, thumb = base + g.src.replace(/^images\//, 'images/thumb/');
      var w = function(f){ return f.replace(/\.jpe?g$/i, '.webp'); };
      var img = document.getElementById('heroImg'), webp = document.getElementById('heroWebp');
      var sizes = '(max-width:980px) min(calc(100vw - 32px), 30rem), 46vw';
      fig.dataset.idx = lista[k];
      fig.setAttribute('aria-label', g.label);
      img.alt = g.label;
      document.getElementById('heroCap').textContent = g.label;
      document.getElementById('heroPos').textContent = (k + 1) + ' / ' + lista.length;
      /* srcset antes de src, senao o browser pede os dois */
      webp.sizes = sizes; webp.srcset = w(thumb) + ' 608w, ' + w(full) + ' 1280w';
      img.sizes = sizes; img.srcset = thumb + ' 608w, ' + full + ' 1280w';
      img.onerror = function(){ img.onerror = null; webp.remove(); img.srcset = thumb + ' 608w, ' + full + ' 1280w'; };
      img.src = full;
    })();
    </script>
  </div>

  <!-- WORK — logo a seguir a abertura: o titulo, os filtros e a contagem numa
       barra, e a parede. A contagem conta a parede. -->
  <section id="work">
    <div class="head wall-bar rv">
      <h2 class="sec-title rv" data-t="galleryTitle"></h2>
      <div class="filters" id="filters" role="group" aria-label="Filter gallery"></div>
      <span class="count" id="workCount" aria-live="polite" aria-atomic="true"></span>
    </div>
    <div class="wall" id="wall"></div>
    <p class="wall-empty" id="wallEmpty" data-t="wallEmpty"></p>
    <!-- aparece so no "Tudo", enquanto a parede estiver na pre-visualizacao -->
    <div class="wall-more" id="wallMoreRow" hidden>

<script>
/* ================  RENDER — no need to edit below  ================ */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
/* A lingua: a que veio no link (?lang=pt, quando se volta do loja.html),

const LANG_PEDIDA = new URLSearchParams(location.search).get('lang');
let LANG = (LANG_PEDIDA === 'pt' || LANG_PEDIDA === 'en') ? LANG_PEDIDA
  : ((navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en');
let activeCat = 'all';
/* a parede abre na pre-visualizacao; o botao abre-a toda e fica aberta */
let wallOpen = false;
/* o tema e escolhido no topo da pagina, antes de pintar */
const T  = () => CONFIG.i18n[LANG];
const rc = r => ({'34':'r-34','12':'r-12','11':'r-11','43':'r-43'})[String(r)] || 'r-34';
const pretty = r => ({'34':'3:4','12':'1:2','11':'1:1','43':'4:3'})[String(r)] || r;
const no = i => String(i + 1).padStart(3, '0');
const srcOf = s => /^https?:\/\//i.test(s) ? s : (CONFIG.imageBase || '') + s;

/* image that degrades to a labelled placeholder when the file is missing.
   full=false  → serve images/thumb/… (760px) — grelha, tira, cartões
   full=true   → serve o ficheiro grande (1600px) — só no lightbox            */
const DIMS = {"aki.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"angela.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"arkevil-final.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"arti.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"clair.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"collab-mira-final.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"collab.jpg":{"w":1600,"h":1280,"tw":760,"th":608},"dante.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"edan.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"estudo-luz.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"even-yeager.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"final-aot-season-4.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"geisha.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"ilustracao-sem-titulo-1.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"ilustracao-sem-titulo.jpg":{"w":1600,"h":1067,"tw":760,"th":507},"italy.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"kei.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"kindo.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"kon.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"lucy.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"lumi.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"makima.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"masami.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"mira-starborn.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"nami-30x40.jpg":{"w":1200,"h":1600,"tw":570,"th":760},"oc-1.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"oc-2.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"oc.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"op-deck-2-clubs.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-2-diamonds.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-2-hearts.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-2-spades.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-ace-clubs.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-ace-diamonds.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-ace-hearts.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-ace-spades.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-back.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-blackbeard.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-buggy.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-crocodile.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-doflamingo.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-hancock.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-kaido.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-katakuri.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-luffy.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-nami.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-robin.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-roger.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-shanks.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-yamato.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"op-deck-zoro.jpg":{"w":1139,"h":1600,"tw":541,"th":760},"pochita.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"proj-pamp-2.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"proj-pamp-3.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"proj-pamp-4.jpg":{"w":1600,"h":900,"tw":760,"th":428},"proj-pamp-5.jpg":{"w":1043,"h":1600,"tw":496,"th":760},"proj-pamp-6.jpg":{"w":1043,"h":1600,"tw":496,"th":760},"proj-pamp.jpg":{"w":1553,"h":1600,"tw":738,"th":760},"proj-sok.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"proj-tr-2.jpg":{"w":1067,"h":1600,"tw":507,"th":760},"proj-tr-3.jpg":{"w":1066,"h":1600,"tw":507,"th":760},"proj-tr-4.jpg":{"w":1067,"h":1600,"tw":507,"th":760},"proj-tr.jpg":{"w":1066,"h":1600,"tw":507,"th":760},"shocked.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"silen.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"spain.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"surpresa.jpg":{"w":1600,"h":1600,"tw":760,"th":760},"the-witch.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"yakura.jpg":{"w":1280,"h":1600,"tw":608,"th":760},"yuta-fanart.jpg":{"w":1280,"h":1600,"tw":608,"th":760}};
/* (O arOf, que dava a cada moldura a proporcao do seu ficheiro, saiu com a
   grelha uniforme de Set 2026: as molduras sao todas 4:5 e a obra entra
   inteira com object-fit:contain. O DIMS continua a dar width/height.) */
/* O browser suporta WebP? Testamos uma vez. O WebP pesa menos ~39% com a mesma
   qualidade — quem nao suportar recebe o .jpg de sempre, sem dar por nada.
   Os .webp geram-se com:  python3 tools/make-webp.py                          */
const WEBP_OK = (() => {
  try { return document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0; }
  catch(e){ return false; }
})();

function artEl(item, full){
  const img = document.createElement('img');
  const file = item.src.split('/').pop();
  const jpg = full ? item.src : item.src.replace(/^images\//,'images/thumb/');
  const webp = jpg.replace(/\.jpe?g$/i, '.webp');
  const useWebp = WEBP_OK && webp !== jpg;
  const d = DIMS[file];
  if(d){ img.width = full ? d.w : d.tw; img.height = full ? d.h : d.th; }
  /* Ecras retina precisam do dobro dos pixeis. A miniatura de 608px chega para
     a grelha (as molduras sao pequenas), mas NAO chega para a obra do hero, que
     aparece grande: num telemovel @2x sai a 0,90x e num @3x a 0,60x, ou seja,
     desfocada. Com srcset o browser escolhe — ficheiro pequeno em ecras 1x,
     original em retina. So o hero leva isto; por na grelha faria cada moldura
     puxar a imagem grande, que e exactamente o que nao queremos.
     O srcset TEM de ser definido antes do src: ao contrario, o browser ja
     comecou a descarregar o src e acaba por puxar os dois ficheiros.          */
  if(item.wide && !full && d){
    const big = useWebp ? item.src.replace(/\.jpe?g$/i, '.webp') : item.src;
    img.sizes = item.sizes || '100vw';
    img.srcset = `${srcOf(useWebp ? webp : jpg)} ${d.tw}w, ${srcOf(big)} ${d.w}w`;
  }
  img.src = srcOf(useWebp ? webp : jpg); img.alt = item.label;
  img.decoding = 'async';
  if(item.eager){ img.fetchPriority = 'high'; } else { img.loading = 'lazy'; }
  /* a imagem NAO leva molde. Dentro da moldura enche-a (width/height 100%), e
     no hero e na lightbox e a proporcao natural do ficheiro que manda. Os
     atributos width/height acima vem de DIMS, por isso o browser ja reserva o
     espaco certo antes de descarregar e o CLS continua a zero. */
  let jpgTried = !useWebp;
  img.onerror = () => {
    if(!jpgTried){          // .webp em falta (arte nova sem converter?) → tenta o .jpg
      jpgTried = true;
      img.src = srcOf(jpg);
      return;
    }
    const ph = document.createElement('div');
    ph.className = 'ph ' + rc(item.ratio);
    ph.innerHTML = `<b>${item.label}</b><span data-ph>${T().placeholderNote}</span><span style="opacity:.5">${pretty(item.ratio)}</span>`;
    if(img.parentNode) img.replaceWith(ph);
  };
  return img;
}

/* ---------- o projecto em destaque ----------
   CONFIG.featured escolhe o projecto que ganha o cartao grande no topo dos
   Projectos (Set 2026: o Survival of Kings). A parede ja nao o destaca. */
const featProj = () => CONFIG.projects.find(p => p.key === CONFIG.featured);

/* a obra g entra no filtro c? A categoria e uma so; "collab" e uma marca a
   mais, por isso uma colab de fan art aparece nos dois filtros. A parede e a
   lightbox perguntam aqui, para nunca discordarem. */
const noFiltro = (g, c) => c === 'all' || g.cat === c || (c === 'collab' && !!g.collab);

/* uma moldura da parede ou do destaque: abre a obra i na lightbox */
function frameEl(g, i){
  const fig = document.createElement('figure');
  fig.className = 'frame';
  fig.dataset.cat = g.cat;
  fig.tabIndex = 0; fig.setAttribute('role','button'); fig.setAttribute('aria-label', g.label);
  const meta = document.createElement('figcaption');
  meta.className = 'meta';
  meta.innerHTML = `<div class="t">${g.label}</div>`;
  fig.append(artEl(g), meta);
  fig.onclick = () => openLb(i);
  fig.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(i); } };
  return fig;
}

/* ---------- a parede ---------- */
function renderWall(){
  const s = $('#wall'); s.innerHTML = '';
  CONFIG.artworks.forEach((g,i) => s.append(frameEl(g, i)));
  applyFilter();
}
function setFilter(c){
  activeCat = c;
  $$('#filters .chip').forEach(b => {
    const on = b.dataset.cat === c;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  applyFilter();
}
function applyFilter(){
  let shown = 0;
  const total = $$('#wall .frame').length;
  const preview = CONFIG.wallPreview || total;
  /* no "Tudo", enquanto nao se abrir, so as primeiras `preview`; um filtro
     mostra sempre a categoria inteira */
  const cortar = activeCat === 'all' && !wallOpen && total > preview;
  $$('#wall .frame').forEach((f, i) => {
    const hide = !noFiltro(CONFIG.artworks[i], activeCat) || (cortar && i >= preview);
    f.classList.toggle('hidden', hide);
    if(!hide) shown++;
  });
  $('#workCount').textContent = `${shown} / ${total}`;
  $('#wallMoreRow').hidden = !cortar;
  $('#wallMore').textContent = T().wallMore.replace('{n}', total);
  $('#wallEmpty').classList.toggle('on', shown === 0);
  /* Com um filtro activo sobram menos pecas e a altura reservada no CSS
     deixaria um buraco por baixo. Filtrar e um gesto do utilizador, por isso
     encolher aqui nao conta como salto de pagina. */
  $('#wall').style.minHeight = activeCat === 'all' ? '' : '0px';
}

/* ---------- a abertura: as seis originais, uma de cada vez (o Flip) ----------
   A troca e instantanea, sem animacao: e um gesto que se repete muitas vezes
   seguidas (a regra do Emil: o que e frequente nao anima). Mas so troca
   quando a obra nova ja esta descodificada, para nunca piscar o passe-partout
   vazio; ate la fica a anterior. A moldura escolhida responde logo. */
const heroList = () => (CONFIG.heroArt || []).map(s => CONFIG.artworks.findIndex(a => a.src === s)).filter(i => i >= 0);
const heroSets = g => {
  const full = srcOf(g.src), thumb = srcOf(g.src.replace(/^images\//, 'images/thumb/'));
  const w = f => f.replace(/\.jpe?g$/i, '.webp');
  return { full, jpg: `${thumb} 608w, ${full} 1280w`, webp: `${w(thumb)} 608w, ${w(full)} 1280w` };
};
/* um Image fora da pagina com o mesmo srcset e sizes escolhe o mesmo
   ficheiro que o <picture>, por isso deixa-o em cache */
const heroPreload = g => {
  const s = heroSets(g), p = new Image();
  p.sizes = $('#heroImg').sizes; p.srcset = WEBP_OK ? s.webp : s.jpg; p.src = s.full;
  return p;
};
let heroPedido = 0, heroAquecido = false;
function heroSwap(idx){
  const fig = $('#heroArt');
  if(!fig || fig.hidden) return;
  $$('#heroMini .mini').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.idx === idx)));
  if(+fig.dataset.idx === idx) return;
  const g = CONFIG.artworks[idx], lista = heroList(), pedido = ++heroPedido;
  const aplica = () => {
    if(pedido !== heroPedido) return;          // entretanto escolheu-se outra
    const s = heroSets(g), img = $('#heroImg'), src = $('#heroWebp');
    if(src) src.srcset = s.webp;               // srcset antes de src
    img.srcset = s.jpg; img.src = s.full; img.alt = g.label;
    fig.dataset.idx = idx; fig.setAttribute('aria-label', g.label);
    $('#heroCap').textContent = g.label;
    $('#heroPos').textContent = `${lista.indexOf(idx) + 1} / ${lista.length}`;
  };
  const p = heroPreload(g);
  (p.decode ? p.decode() : Promise.resolve()).then(aplica, aplica);
}
/* as molduras, nas duas linguas (o renderText volta a chamar isto) */
function renderHeroMini(){
  const box = $('#heroMini'), fig = $('#heroArt');
  if(!box || !fig || fig.hidden){ if(box) box.hidden = true; return; }
  const t = T(), atual = +fig.dataset.idx;
  box.setAttribute('aria-label', t.heroPick);
  box.innerHTML = heroList().map(i => {
    const g = CONFIG.artworks[i], th = srcOf(g.src.replace(/^images\//, 'images/thumb/'));
    const f = WEBP_OK ? th.replace(/\.jpe?g$/i, '.webp') : th;
    return `<button class="mini" type="button" data-idx="${i}" aria-pressed="${i === atual}" aria-label="${t.heroShow} ${g.label}">`
      + `<img src="${f}" width="608" height="760" alt="" loading="lazy" fetchpriority="low" decoding="async"></button>`;
  }).join('');
  /* apontar pre-visualiza (so com rato), focar e tocar escolhem */
  const rato = matchMedia('(hover:hover)').matches;
  $$('#heroMini .mini').forEach(b => {
    const i = +b.dataset.idx;
    b.onclick = () => heroSwap(i);
    b.onfocus = () => heroSwap(i);
    if(rato) b.onpointerenter = () => heroSwap(i);
  });
  /* a primeira vez que alguem chega as molduras, as seis obras grandes vao
     para a cache, e dai em diante a troca e imediata */
  const aquece = () => { if(heroAquecido) return; heroAquecido = true;
    heroList().forEach(i => heroPreload(CONFIG.artworks[i])); };
  box.onpointerenter = aquece; box.onfocusin = aquece;
}

/* ---------- everything language-dependent ---------- */
function renderText(){
  const t = T();
  $$('[data-t]').forEach(el => el.textContent = t[el.dataset.t] || '');
  $$('[data-ph]').forEach(el => el.textContent = t.placeholderNote);
  document.documentElement.lang = LANG;
  $('#langTgl').textContent = LANG === 'en' ? 'PT' : 'EN';
  $('#brandName').textContent = CONFIG.artistName;

  renderHeroMini();

  /* a bio, em paragrafos. Era um texto corrido so; em tres blocos le-se melhor
     e cada ideia fica com o seu espaco. */
  $('#aboutBody').innerHTML = (t.aboutBody || []).map(x => `<p>${x}</p>`).join('');

  /* filters */
  const cats = [...new Set(CONFIG.artworks.map(g => g.cat))];
  /* o chip das colabs so aparece se houver alguma, e fica no fim */
  if(CONFIG.artworks.some(g => g.collab)) cats.push('collab');
  $('#filters').innerHTML = ['all', ...cats].map(c =>
    `<button class="chip ${c === activeCat ? 'on' : ''}" data-cat="${c}" aria-pressed="${c === activeCat}">${t.filters[c] || c}</button>`).join('');
  $$('#filters .chip').forEach(b => b.onclick = () => setFilter(b.dataset.cat));
  applyFilter();

  /* projects */
  const projHref = p => `${CONFIG.projectPage}?p=${encodeURIComponent(p.key)}${LANG === 'pt' ? '&lang=pt' : ''}`;
  /* O projecto em destaque (CONFIG.featured): a largura toda, com a capa, o
     texto, as pecas da serie numa tira e os links. Nao e um <a> inteiro como
     os outros cartoes porque leva dois destinos (o projecto e o Webtoon), e
     links dentro de links nao sao permitidos. */
  const fbox = $('#projFeat'); fbox.innerHTML = '';
  const fp = featProj();
  fbox.hidden = !fp;
  if(fp){
    const tp = t.projects[fp.key];
    const href = projHref(fp);
    const art = document.createElement('a');
    art.className = 'pf-art'; art.href = href;
    art.setAttribute('aria-label', `${tp.title} · ${t.openProject}`);
    art.append(artEl(fp));
    const body = document.createElement('div');
    body.className = 'pf-body';
    body.innerHTML = `<span class="k">${tp.kicker}</span><h3><a href="${href}">${tp.title}</a></h3><p>${tp.desc}</p>`;
    const pecas = (fp.gallery || []).slice(0, 7);
    if(pecas.length){
      const strip = document.createElement('a');
      strip.className = 'pf-strip'; strip.href = href;
      strip.setAttribute('aria-label', `${tp.title} · ${t.openProject}`);
      pecas.forEach(src => {
        const g = CONFIG.artworks.find(a => a.src === src) || { src, label: tp.title };
        strip.append(artEl(g));
      });
      body.append(strip);
    }
    const links = document.createElement('div');
    links.className = 'pf-links';
    links.innerHTML = `<a class="btn fill" href="${href}">${t.openProject} →</a>`
      + (fp.link && tp.link ? `<a class="btn" href="${fp.link}" target="_blank" rel="noopener">${tp.link} ↗</a>` : '');
    body.append(links);
    const card = document.createElement('article');
    card.className = 'pf rv';
    card.append(art, body);
    fbox.append(card);
  }
  const grid = $('#projGrid'); grid.innerHTML = '';
  CONFIG.projects.forEach(p => {
    if(fp && p.key === fp.key) return;   // ja esta no cartao grande
    const tp = t.projects[p.key];
    const card = document.createElement('a');
    card.className = 'proj rv';
    card.href = projHref(p);
    /* sem target=_blank: e uma pagina do proprio site e ela ja traz o link de
       voltar. Abrir separadores por cima dos separadores de alguem e das
       coisas que so incomodam. */
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `<span class="k">${tp.kicker}</span><h3>${tp.title}</h3><p>${tp.desc}</p>
      <span class="go">${t.openProject} →</span>`;
    if(p.src){
      card.append(artEl(p), body);
    } else {
      const plate = document.createElement('div');
      plate.className = 'plate ' + rc(p.ratio);
      plate.setAttribute('aria-hidden','true');
      plate.innerHTML = `<span>${p.plate || ''}</span>`;
      card.append(plate, body);
    }
    grid.append(card);
  });

  /* timeline — grouped by year, oldest first */
  const tl = $('#tl'); tl.innerHTML = '';
  const evts = [...CONFIG.timeline].sort((a,b) =>
    (a.year - b.year)
    || (a.status === b.status ? 0 : (a.status === 'past' ? -1 : 1))
    || ((a.month || 13) - (b.month || 13)));
  const firstNext = evts.find(e => e.status === 'next');
  let lastYear = null;
  evts.forEach(e => {
    const te = t.timeline[e.key];
    const cell = document.createElement('div');
    cell.className = 'tl-year';
    if(e.year !== lastYear){
      lastYear = e.year;
      cell.classList.add('rv');
      if(evts.some(x => x.year === e.year && x.status === 'next')) cell.classList.add('has-next');
      cell.textContent = e.year;
    }
    tl.append(cell);
    /* o ano ja aparece em grande na coluna da esquerda no primeiro item de cada
       grupo, por isso aqui so se repete quando NAO aparece la. Sem isso ficava
       "2023" duas vezes lado a lado. */
    /* O mes sozinho: o ano ja esta em grande a cabeca do grupo (a coluna da
       esquerda no desktop, o titulo no telemovel). Repetir "ABR 2026" debaixo
       de "2026" era ruido, e o primeiro item do grupo ficava diferente dos
       outros. So um item sem mes e sem ano em grande leva o ano escrito. */
    const showsBigYear = cell.textContent !== '';
    const when = e.month ? t.months[e.month-1] : (showsBigYear ? '' : `${e.year}`);
    const flag = e.status === 'next'
      ? `<span class="tl-flag">${e === firstNext ? t.tlNext : t.tlUpcoming}</span>` : '';
    const item = document.createElement('article');
    item.className = `tl-item rv ${e.status}`;
    item.innerHTML =
      `<span class="tl-dot" aria-hidden="true"></span>
       <p class="tl-when">${when}${flag}</p>
       <h3>${te.title}</h3>
       <p class="tl-where">${te.where}</p>
       <p class="tl-desc">${te.desc}</p>`;
    tl.append(item);
  });

  /* loja e comissoes — vivem no loja.html. Daqui so se la chega.
     O link leva a lingua escolhida (?lang=pt), senao quem mudou para PT aqui
     caia em EN do outro lado. O link "Loja" (menu e faixa) so aparece com
     shopOpen:true; antes disso a pagina mostra so as comissoes. */
  const shopOn = !!CONFIG.shopOpen;
  /* as duas copias do link do menu (a da barra e a que o painel movel
     clonou) e o botao da faixa */
  $$('[data-shop-link]').forEach(a => { a.hidden = !shopOn; });
  const lq = LANG === 'pt' ? '?lang=pt' : '';
  $$('[data-loja]').forEach(a => { a.href = `loja.html${lq}${a.dataset.loja}`; });
  $('#commFormats').innerHTML = CONFIG.tiers.map(x => `<li>${t.tiers[x.key].name}</li>`).join('');
  const open = CONFIG.commissionsOpen;
  const badge = $('#commBadge');
  badge.textContent = open ? t.commOpen : t.commClosed;
  badge.className = 'badge ' + (open ? 'open' : 'closed');

  /* contact */
  $('#mailLink').textContent = CONFIG.email;
  $('#mailLink').href = 'mailto:' + CONFIG.email;
  $('#cLinks').innerHTML =
    `<a href="${CONFIG.instagram}" target="_blank" rel="noopener">Instagram ↗</a>` +
    CONFIG.otherLinks.map(l => l.url && l.url !== '#'
      ? `<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`
      /* sem destino real: texto simples, nao um link que nao vai a lado nenhum.
         Assim que puseres o url no CONFIG volta a ser link sozinho. */
      : `<span class="c-soon">${l.label}</span>`).join('');
  $('#footL').textContent = `© ${new Date().getFullYear()} ${CONFIG.artistName} · ${CONFIG.realName}`;

  observeReveals();
}

/* ---------- lightbox ---------- */
let lbIdx = 0;
const visibleIdxs = () => CONFIG.artworks.map((g,i) => i)
  .filter(i => noFiltro(CONFIG.artworks[i], activeCat));
let lbOpener = null;
function openLb(i){
  lbOpener = document.activeElement;
  lbIdx = i; $('#lb').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#lbClose').focus(); drawLb();
}
function drawLb(){
  const g = CONFIG.artworks[lbIdx];
  const st = $('#lbStage'); st.innerHTML = ''; st.append(artEl(g, true));
  /* Onde estou na sequencia. Sem isto nao se percebia se faltavam duas pecas
     ou vinte, e o filtro activo muda o total — por isso conta-se sobre a
     categoria. Conta tambem as que a pre-visualizacao da parede esconde: as
     setas sao uma forma de ver tudo sem abrir a parede. */
  const v = visibleIdxs();
  const pos = v.indexOf(lbIdx) + 1;
  $('#lbCap').textContent = `${no(lbIdx)} · ${g.label}`;
  $('#lbPos').textContent = pos ? `${pos} ${T().lbOf} ${v.length}` : '';
  preloadNeighbours();
}
/* A peca seguinte e a anterior ficam em cache antes de alguem carregar na
   seta. E so pedir o ficheiro: o browser guarda-o e o passo fica instantaneo.
   Sem isto, cada seta era um carregamento a branco. */
function preloadNeighbours(){
  const v = visibleIdxs(); if(v.length < 2) return;
  const pos = Math.max(0, v.indexOf(lbIdx));
  [1, -1].forEach(d => {
    const g = CONFIG.artworks[v[(pos + d + v.length) % v.length]];
    if(g) artEl(g, true);
  });
}
function closeLb(){ $('#lb').classList.remove('open'); document.body.style.overflow = '';
  if(lbOpener && lbOpener.focus) lbOpener.focus(); }
function stepLb(d){
  const v = visibleIdxs(); if(!v.length) return;
  const pos = Math.max(0, v.indexOf(lbIdx));
  lbIdx = v[(pos + d + v.length) % v.length];
  drawLb();
}
$('#wallMore').onclick = () => {
  const preview = CONFIG.wallPreview || 0;
  wallOpen = true; applyFilter();
  /* o foco vai para a primeira peca nova, senao quem usa teclado ficava no
     botao que acabou de desaparecer */
  const f = $$('#wall .frame')[preview];
  if(f) f.focus({ preventScroll: true });
};
/* a obra da abertura abre na lightbox, como uma moldura da parede (o script
   da abertura guardou em data-idx qual e) */
(() => {
  const f = $('#heroArt'); if(!f || f.hidden || f.dataset.idx === undefined) return;
  const abre = () => openLb(+f.dataset.idx);
  f.onclick = abre;
  f.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abre(); } };
})();
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick  = () => stepLb(-1);
$('#lbNext').onclick  = () => stepLb(1);
$('#lb').onclick = e => { if(e.target === $('#lb')) closeLb(); };
/* Arrastar para o lado, no telemovel. As setas sao pequenas num ecra de mao e
   o gesto e o que toda a gente ja tenta. 45px de limiar para nao disparar num
   toque torto; se o movimento for mais vertical do que horizontal e scroll e
   nao conta. */
let swX = 0, swY = 0;
$('#lb').addEventListener('touchstart', e => {
  swX = e.changedTouches[0].clientX; swY = e.changedTouches[0].clientY;
}, {passive:true});
$('#lb').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swX;
  const dy = e.changedTouches[0].clientY - swY;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) stepLb(dx < 0 ? 1 : -1);
}, {passive:true});
addEventListener('keydown', e => {
  if(!$('#lb').classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'Tab'){                                  // o foco não escapa do lightbox
    const f = [...$('#lb').querySelectorAll('button')];
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
  if(e.key === 'ArrowLeft') stepLb(-1);
  if(e.key === 'ArrowRight') stepLb(1);
});


/* ---------- VFX ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* O parallax do hero foi removido. Corria dentro de um listener de scroll na
   window, o que a regra 5.D da tasteskill proíbe de forma dura (dispara a cada
   frame de scroll, sem batching). Estava atenuado com rAF e passive, mas a
   regra e binaria. A leitura dos diais tambem diz que este site ja tinha
   movimento a mais (8) para um portefolio (preset 7), por isso a decisao foi
   apagar em vez de reescrever com animation-timeline.                        */

/* entrada escalonada: os elementos irmãos entram em cascata, não em bloco.
   Só funciona em elementos que tenham a classe .rv — é ela que os põe
   invisíveis à espera do scroll. Num elemento sem .rv isto define um atraso
   numa transição que nunca acontece, ou seja, não faz nada. */
function stagger(sel, ms){
  document.querySelectorAll(sel).forEach((el,i) => {
    el.style.transitionDelay = REDUCED ? '0s' : (i % 8) * ms + 'ms';
  });
}

/* ---------- reveal on scroll ---------- */
let io;
function observeReveals(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.1});
  /* .frame não leva .rv — só os contentores é que levam,
     por isso estes três staggers estavam a atrasar transições inexistentes.
     Ficam de fora. Se um dia quiseres a cascata peça a peça, junta 'rv' à
     classe do elemento (como o .proj faz) e volta a chamar stagger para ele. */
  stagger('.proj', 100);
  $$('.rv').forEach(el => io.observe(el));
}

/* ---------- dados estruturados ----------
   O preco vivia em quatro sitios: CONFIG, Shopify, os Termos no Notion e este
   bloco JSON-LD. Agora o JSON-LD copia-se do CONFIG, por isso sao tres.
   Diz tambem ao Google se as comissoes estao abertas ou fechadas, o que sai
   directamente do commissionsOpen.                                          */
function syncStructuredData(){
  const el = $('#ldPerson');
  if(!el) return;
  let data;
  try { data = JSON.parse(el.textContent); } catch(e){ return; }
  const names = CONFIG.i18n.en.tiers;          // o schema fica sempre em EN
  /* Sem price nem priceCurrency: se o preco nao esta na pagina, tambem nao
     pode estar aqui — este bloco e o que o Google le e mostra nos resultados.
     O que fica dito e que os quatro formatos existem e se estao abertos. */
  data.makesOffer = CONFIG.tiers.map(x => ({
    "@type": "Offer",
    name: `${names[x.key] ? names[x.key].name : x.key} commission`,
    availability: CONFIG.commissionsOpen
      ? "https://schema.org/InStock"
      : "https://schema.org/OutOfStock",
  }));
  el.textContent = JSON.stringify(data, null, 2);

  /* ---- a galeria, obra a obra ----
     Ate agora o Google so sabia que existe um ilustrador; nao sabia que ha 28
     desenhos nesta pagina. Isto descreve-os um a um, com o ficheiro grande, a
     miniatura e as medidas reais, que e o que a Pesquisa de Imagens quer.
     De proposito NAO leva precos nem ofertas: 10 destas pecas sao fan art e
     nao estao a venda, e marcar arte como produto seria dizer o contrario. O
     creator e o Frede porque o desenho e dele — a personagem, nos casos de fan
     art, nao, e por isso tambem nao se reclama nada sobre ela.               */
  const canonical = document.querySelector('link[rel="canonical"]');
  const base = (canonical ? canonical.href : location.href).replace(/[^/]*$/, '');
  const abs = p => /^https?:\/\//i.test(p) ? p : base + p.replace(/^\//, '');
  const me = { "@type": "Person", name: CONFIG.realName, alternateName: CONFIG.artistName };

  const gallery = {
    "@context": "https://schema.org",
    "@type": "ImageGallery",
    name: `${CONFIG.artistName} — ${CONFIG.i18n.en.galleryTitle}`,
    url: canonical ? canonical.href : location.href,
    author: me,
    associatedMedia: CONFIG.artworks.map(a => {
      const file = a.src.split('/').pop();
      const d = DIMS[file] || {};
      const item = {
        "@type": "ImageObject",
        name: a.label,
        contentUrl: abs(a.src),
        thumbnailUrl: abs(a.src.replace(/^images\//, 'images/thumb/')),
        creator: me,
      };
      if(d.w && d.h){ item.width = d.w; item.height = d.h; }
      return item;
    }),
  };

  let g = $('#ldGallery');
  if(!g){
    g = document.createElement('script');
    g.type = 'application/ld+json';
    g.id = 'ldGallery';
    document.head.append(g);
  }
  g.textContent = JSON.stringify(gallery, null, 2);
}

/* ---------- seccao actual no menu ----------
   Marca no menu a seccao que esta a ser vista. Com IntersectionObserver, nao
   com um listener de scroll: a regra 5.D da tasteskill proibe-os, e um
   observer nem sequer corre entre seccoes.
   aria-current diz o mesmo a quem usa leitor de ecra; o sublinhado azul e so
   a parte visivel.                                                          */
function trackCurrentSection(){
  /* duas copias de cada link agora: a da barra e a do painel movel. O mapa
     guarda as duas, para o aria-current valer nas duas. */
  const links = new Map();
  $$('.links a[href^="#"], #navPanelLinks a[href^="#"]').forEach(a => {
    const id = a.getAttribute('href').slice(1);
    if(!links.has(id)) links.set(id, []);
    links.get(id).push(a);
  });
  const seen = new Set();
  const mark = () => {
    /* a que esta mais acima entre as visiveis ganha, senao duas seccoes
       grandes ao mesmo tempo no ecra acendiam as duas */
    /* quando duas seccoes cruzam a faixa ao mesmo tempo, a certa e a que comeca
       mais abaixo: e essa que estamos a entrar. Ordenar ao contrario marcava
       sempre a anterior. */
    const top = [...seen].map(id => document.getElementById(id))
      .filter(Boolean)
      .sort((a,b) => b.getBoundingClientRect().top - a.getBoundingClientRect().top)[0];
    links.forEach(as => as.forEach(a => a.removeAttribute('aria-current')));
    if(top && links.has(top.id)) links.get(top.id).forEach(a => a.setAttribute('aria-current','true'));
  };
  const io2 = new IntersectionObserver(es => {
    es.forEach(e => e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id));
    mark();
  }, {rootMargin:'-45% 0px -45% 0px'});   /* faixa estreita a meio do ecra */
  links.forEach((_,id) => { const el = document.getElementById(id); if(el) io2.observe(el); });
}

/* ---------- toggles ---------- */
$('#langTgl').onclick = () => { LANG = LANG === 'en' ? 'pt' : 'en'; renderText(); };

/* copiar o endereco. O clipboard so existe em https (ou file://), por isso ha
   sempre a rede de seguranca do execCommand para o resto. */
$('#copyMail').onclick = async () => {
  const btn = $('#copyMail');
  const done = () => {
    btn.textContent = T().copied;
    setTimeout(() => { btn.textContent = T().copyEmail; }, 1600);
  };
  try {
    await navigator.clipboard.writeText(CONFIG.email);
    done();
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = CONFIG.email; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(_){}
    ta.remove();
  }
};
$('#themeTgl').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
};

/* ---------- menu movel ----------
   Os links do painel sao clonados do <nav class="links">: uma lista so, uma
   fonte so. O clone acontece antes do renderText(), por isso as duas copias
   apanham a traducao na mesma passagem.
   O painel fica por baixo do cabecalho (z-index 55 contra 60), de modo que o
   botao continua visivel por cima e fecha o que abriu. */
const navToggle = $('#navToggle'), navPanel = $('#navPanel');
$('#navPanelLinks').append(...[...$$('.links a')].map(a => a.cloneNode(true)));

function setNav(open, refocus){
  navPanel.classList.toggle('open', open);
  navToggle.setAttribute('aria-expanded', String(open));
  document.body.style.overflow = open ? 'hidden' : '';
  if(open){ const first = navPanel.querySelector('a'); if(first) first.focus(); }
  /* so devolvemos o foco ao botao quando foi ele (ou o Escape) a fechar. Se o
     utilizador carregou num link, o foco tem de seguir para a seccao. */
  else if(refocus) navToggle.focus();
}
navToggle.onclick = () => setNav(navToggle.getAttribute('aria-expanded') !== 'true', true);
/* clicar num link salta para a seccao: o painel nao tem de ficar aberto */
$$('#navPanelLinks a').forEach(a => a.addEventListener('click', () => setNav(false, false)));

addEventListener('keydown', e => {
  if(!navPanel.classList.contains('open')) return;
  if(e.key === 'Escape'){ setNav(false, true); return; }
  if(e.key === 'Tab'){                     /* o foco nao sai do painel */
    const f = [...navPanel.querySelectorAll('a'), navToggle];
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

/* Se o ecra crescer para la dos 620px os links da barra voltam e o painel deixa
   de fazer sentido: fechamos, senao ficava aberto e a bloquear o scroll.
   matchMedia em vez de um listener de resize — so dispara na travessia. */
const navMq = matchMedia('(min-width:621px)');
navMq.addEventListener('change', e => { if(e.matches && navPanel.classList.contains('open')) setNav(false, false); });

/* ---------- boot ---------- */
renderWall();
renderText();
syncStructuredData();
trackCurrentSection();
</script>
