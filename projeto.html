<script>
/* ================================================================
   ████  CONFIG — so o pedaco que esta pagina usa  ████
   O CONFIG inteiro vive no index.html. Aqui fica so o que esta
   pagina le: os projectos e os textos deles.
   Ja foi uma copia completa do outro e a copia derivou: ficaram ca
   precos, fases e prazos de comissoes que o site nao mostra em lado
   nenhum e que o CLAUDE.md §9.4 proibe explicitamente de ter no
   CONFIG. Nao renderizavam nada, mas iam no codigo-fonte que o
   Netlify serve, e bastava abrir "ver origem" para os ler.
   O que nao esta aqui nao pode ficar desactualizado. Se mexeres num
   projecto, mexe nos dois ficheiros — e so nestes campos.
   ================================================================ */
const CONFIG = {

  /* ---------- IDENTITY ----------
     So os dois nomes do rodape. O email, o Instagram e a loja vivem
     no index.html: esta pagina nao liga para nenhum deles. */
  artistName: "Guita_Ink",
  realName: "Frederico Guita",

  /* ---------- PROJECTS ----------
     Os quatro ja tem arte. Se algum dia um src ficar "", a pagina volta
     a mostrar a placa tipografica de proposito — nunca uma ilustracao
     que nao seja do projecto. Para meter arte nova:
       python3 tools/add-artwork.py <ficheiro> --slug proj-xxx
     e depois poe o caminho no src aqui e no index.html.

     src     = a capa. E ela que vai no cartao do index e no og:image.
     gallery = opcional, as restantes imagens da serie, por ordem. Um
               projecto que e uma serie (as capas mensais do Tokyo
               Revengers, as cartas de um baralho) mostra-as todas aqui;
               o cartao do index continua a mostrar so a capa.
               Sem gallery, a pagina comporta-se como sempre se comportou.
               Depois de mexer nisto corre o tools/dims.py: as medidas de
               TODAS estas imagens sao geradas de la. */
  projects: [
    { src: "images/proj-sok.jpg", label: "Survival of Kings", ratio: "34", key: "sok", plate: "SOK",
      gallery: ["images/arti.jpg", "images/kei.jpg", "images/edan.jpg", "images/lumi.jpg", "images/masami.jpg", "images/yakura.jpg", "images/kindo.jpg"] },
    { src: "images/proj-tr.jpg", label: "Tokyo Revengers", ratio: "34", key: "tr", plate: "TR",
      gallery: ["images/proj-tr-2.jpg", "images/proj-tr-3.jpg", "images/proj-tr-4.jpg"] },
    { src: "images/proj-pamp.jpg", label: "PAMP", ratio: "34", key: "pamp", plate: "P",
      gallery: ["images/proj-pamp-2.jpg", "images/proj-pamp-3.jpg", "images/proj-pamp-4.jpg", "images/proj-pamp-5.jpg", "images/proj-pamp-6.jpg"] },
    { src: "images/op-deck-ace-hearts.jpg", label: "One Piece Deck", ratio: "34", key: "deck", plate: "Q",
      /* Ordem natural do baralho: o verso primeiro, depois naipe a naipe
         (espadas, copas, ouros, paus), cada um As, 2, Valete, Dama, Rei;
         os Jokers no fim. O As de copas e a capa e volta a aparecer no
         seu lugar, para o naipe de copas ficar inteiro. */
      gallery: ["images/op-deck-back.jpg",
                "images/op-deck-ace-spades.jpg", "images/op-deck-2-spades.jpg", "images/op-deck-katakuri.jpg", "images/op-deck-yamato.jpg", "images/op-deck-shanks.jpg",
                "images/op-deck-ace-hearts.jpg", "images/op-deck-2-hearts.jpg", "images/op-deck-doflamingo.jpg", "images/op-deck-hancock.jpg", "images/op-deck-luffy.jpg",
                "images/op-deck-ace-diamonds.jpg", "images/op-deck-2-diamonds.jpg", "images/op-deck-crocodile.jpg", "images/op-deck-nami.jpg", "images/op-deck-roger.jpg",
                "images/op-deck-ace-clubs.jpg", "images/op-deck-2-clubs.jpg", "images/op-deck-kaido.jpg", "images/op-deck-robin.jpg", "images/op-deck-blackbeard.jpg",
                "images/op-deck-zoro.jpg", "images/op-deck-buggy.jpg"] },
  ],

  /* ---------- COPY DOS PROJECTOS (EN / PT) ----------
     So os projectos. Todo o resto do texto do site vive no index.html
     e esta pagina nunca lhe toca. */
  i18n: {
    en: {
      projects: {
        sok: { kicker: "Webtoon series", title: "Survival of Kings", desc: "Ongoing webtoon / graphic novel, co-created with writer Reeeborn. Ink-style panels and vertical-scroll storytelling." },
        tr: { kicker: "Monthly, with Distrito Manga", title: "Tokyo Revengers, covers reimagined", desc: "Each volume cover redrawn in the original format, with faces from the anime and manga community standing in for the characters. A new one goes out every month, alongside the publisher's releases." },
        pamp: { kicker: "Visual identity", title: "PAMP: Prémios Anime Manga Portugal", desc: "Full visual identity: key art, logo lock-ups and event graphics." },
        deck: { kicker: "Fan art, playing cards", title: "One Piece Deck", desc: "One Piece characters drawn as playing cards. Queens: Nami, Robin, Yamato and Boa Hancock. Kings: Gol D. Roger, Luffy, Blackbeard and Shanks. Jacks: Crocodile, Katakuri, Doflamingo and Kaido. Jokers: Zoro and Buggy. Each ace carries the flag of its king's crew." },
      },
    },
    pt: {
      projects: {
        sok: { kicker: "Série webtoon", title: "Survival of Kings", desc: "Webtoon / graphic novel em curso, co-criado com o escritor Reeeborn. Painéis a tinta e narrativa em scroll vertical." },
        tr: { kicker: "Mensal, com a Distrito Manga", title: "Tokyo Revengers, capas reinterpretadas", desc: "Cada capa de volume refeita no formato original, com figuras da comunidade anime e manga no lugar das personagens. Sai uma por mês, a acompanhar os lançamentos da editora." },
        pamp: { kicker: "Identidade visual", title: "PAMP: Prémios Anime Manga Portugal", desc: "Identidade visual completa: key art, logótipos e grafismo de evento." },
        deck: { kicker: "Fan art, cartas de jogar", title: "One Piece Deck", desc: "Personagens de One Piece desenhadas como cartas de jogar. Damas: Nami, Robin, Yamato e Boa Hancock. Reis: Gol D. Roger, Luffy, Barba Negra e Shanks. Valetes: Crocodile, Katakuri, Doflamingo e Kaido. Jokers: Zoro e Buggy. Cada ás leva a bandeira da tripulação do seu rei." },

<style>
:root{
  --void:#0A0A0A;         /* the field */
  --raise:#121212;        /* raised surface */
  --raise-2:#1A1A1A;
  --frog:#80AB5C;        /* o verde do sapo (era o azul Royal): ver o index */
  --frog-lift:#80AB5C;   /* 7,45:1 sobre --void; texto POR CIMA dele e escuro */
  --bone:#F2F0EC;
  --bone-dim:#8C877F;
  --hair:rgba(242,240,236,.13);
  --f-disp:'Playfair Display',Georgia,serif;
  --f-body:'LT Museum','Lora',Georgia,serif;      /* corpo — LT Museum se estiver instalada */
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
}
[data-theme="light"]{
  --void:#F4F2ED;
  --raise:#FFFFFF;
  --raise-2:#EDEAE3;
  --frog:#456827;        /* o mesmo verde, escurecido para passar no claro */
  --frog-lift:#456827;
  --bone:#141310;
  --bone-dim:#6B655C;
  --hair:rgba(20,19,16,.13);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body);background:var(--void);color:var(--bone);
  line-height:1.65;font-weight:300;-webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;overflow-x:hidden;
}
img{display:block;max-width:100%;height:auto}  /* par obrigatorio: sem height:auto a imagem esmaga */
a{color:inherit}
::selection{background:var(--frog);color:var(--void)}
:focus-visible{outline:2px solid var(--frog-lift);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 26px;position:relative;z-index:1}
/* film grain */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.16'/></svg>");
}
header,main,footer{position:relative;z-index:1}

.back{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-ui);
  font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim);
  padding:30px 0;transition:color .2s;
}
.back:hover{color:var(--bone)}
.k{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--frog-lift)}
/* Esta pagina nao tinha bloco nenhum de prefers-reduced-motion, e o §9.8 diz
   que ele desliga todos os efeitos. Sao poucos: o scroll suave, a transicao de
   cor do corpo e a do link de voltar. O grao do body::after fica — e uma
   textura parada, nao e movimento. */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body,.back{transition:none}
}

h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 20px;line-height:1.1}
.lede{color:var(--bone-dim);font-size:1.05rem;max-width:44rem}
.plate{
  aspect-ratio:16/9;display:grid;place-items:center;background:var(--raise-2);
  margin:40px 0;position:relative;overflow:hidden;border:1px solid var(--hair);
}
.plate::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--frog) 1px,transparent 1.4px);background-size:16px 16px;opacity:.16}
.plate span{font-family:var(--f-disp);font-size:clamp(3rem,9vw,5.5rem);color:var(--frog-lift);z-index:1}
/* A serie. Um projecto com uma imagem so continua a dar exactamente o mesmo
   resultado de antes: um <img> sozinho dentro deste contentor.
   As medidas vao nos atributos width/height (do PROJ_DIMS) para o browser
   reservar o espaco antes de a imagem chegar — sem elas a caixa tinha altura
   zero e a nota e o rodape saltavam. Com varias imagens isso multiplica-se,
   por isso aqui importa ainda mais do que importava com uma. */
.shots{display:flex;flex-direction:column;gap:20px;margin:40px 0}
.shots img{width:100%;height:auto;display:block;border:1px solid var(--hair)}
/* O resto da serie, numa grelha. Empilhadas a largura toda, as 22 cartas do
   baralho davam ~27000px de scroll e nao se via a serie como serie. A capa
   continua grande por cima; cada peca da grelha abre o ficheiro inteiro.
   auto-fill com um minimo de 200px: tres por linha no desktop, duas num
   telemovel. Nunca se corta nada: cada imagem guarda a sua proporcao. */
.grelha{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;align-items:start}
.grelha a{display:block;transition:transform .12s ease-out}
.grelha a:active{transform:scale(.97)}
@media (max-width:620px){.grelha{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
/* §9.8 — tem de vir DEPOIS das regras da grelha: no bloco de cima perdia
   para elas por ordem, e a transicao continuava ligada (o verify apanhou-o). */
@media (prefers-reduced-motion:reduce){
  .grelha a{transition:none}
  .grelha a:active{transform:none}
}
.note{
  border-left:2px solid var(--frog);padding-left:16px;color:var(--bone-dim);font-size:.9rem;margin:40px 0;
}
footer{border-top:1px solid var(--hair);margin-top:60px;padding:26px 0 50px;font-family:var(--f-ui);
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← <span id="backLabel">All work</span></a>
  <p class="k" id="kicker"></p>
  <h1 id="title"></h1>
  <p class="lede" id="desc"></p>
  <div class="plate" id="plate" aria-hidden="true"><span></span></div>
  <p class="note" id="note"></p>
  <footer>
    <span id="footL"></span>
    <a href="index.html" id="footBack"></a>
  </footer>
</div>

<script>
/* Lê ?p=chave, mostra o projeto correspondente. As chaves e os textos vêm do
   CONFIG acima — os mesmos que alimentam os cartões do index.html.          */
const q = new URLSearchParams(location.search);
const key = q.get('p');
/* a lingua que veio no link do index (?lang=pt), senao a do browser */
const pedida = q.get('lang');
const LANG = (pedida === 'pt' || pedida === 'en') ? pedida
  : ((navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en');
const t = CONFIG.i18n[LANG];
document.documentElement.lang = LANG;

/* Mesma deteccao do index.html: uma vez por pagina, sem pedidos de rede. */
const WEBP_OK = (() => {
  try { return document.createElement('canvas')
    .toDataURL('image/webp').indexOf('data:image/webp') === 0; }
  catch(e){ return false; }
})();
/* Medidas reais das artes dos projectos. O index tem o mapa DIMS completo;
   aqui so fazem falta estas tres. GERADO: sai do tools/dims.py, que le os
   pixeis verdadeiros. Troca a arte de um projecto e corre o script — nao
   escrevas estes numeros a mao. */
const PROJ_DIMS = {
  "proj-sok.jpg":             {w:1280, h:1600},
  "arti.jpg":                 {w:1280, h:1600},
  "kei.jpg":                  {w:1280, h:1600},
  "edan.jpg":                 {w:1280, h:1600},
  "lumi.jpg":                 {w:1280, h:1600},
  "masami.jpg":               {w:1280, h:1600},
  "yakura.jpg":               {w:1280, h:1600},
  "kindo.jpg":                {w:1280, h:1600},
  "proj-tr.jpg":              {w:1066, h:1600},
  "proj-tr-2.jpg":            {w:1067, h:1600},
  "proj-tr-3.jpg":            {w:1066, h:1600},
  "proj-tr-4.jpg":            {w:1067, h:1600},
  "proj-pamp.jpg":            {w:1553, h:1600},
  "proj-pamp-2.jpg":          {w:1280, h:1600},
  "proj-pamp-3.jpg":          {w:1280, h:1600},
  "proj-pamp-4.jpg":          {w:1600, h:900},
  "proj-pamp-5.jpg":          {w:1043, h:1600},
  "proj-pamp-6.jpg":          {w:1043, h:1600},
  "op-deck-ace-hearts.jpg":   {w:1139, h:1600},
  "op-deck-back.jpg":         {w:1139, h:1600},
  "op-deck-ace-spades.jpg":   {w:1139, h:1600},
  "op-deck-2-spades.jpg":     {w:1139, h:1600},
  "op-deck-katakuri.jpg":     {w:1139, h:1600},
  "op-deck-yamato.jpg":       {w:1139, h:1600},
  "op-deck-shanks.jpg":       {w:1139, h:1600},
  "op-deck-2-hearts.jpg":     {w:1139, h:1600},
  "op-deck-doflamingo.jpg":   {w:1139, h:1600},
  "op-deck-hancock.jpg":      {w:1139, h:1600},
  "op-deck-luffy.jpg":        {w:1139, h:1600},
  "op-deck-ace-diamonds.jpg": {w:1139, h:1600},
  "op-deck-2-diamonds.jpg":   {w:1139, h:1600},
  "op-deck-crocodile.jpg":    {w:1139, h:1600},
  "op-deck-nami.jpg":         {w:1139, h:1600},
  "op-deck-roger.jpg":        {w:1139, h:1600},
  "op-deck-ace-clubs.jpg":    {w:1139, h:1600},
  "op-deck-2-clubs.jpg":      {w:1139, h:1600},
  "op-deck-kaido.jpg":        {w:1139, h:1600},
  "op-deck-robin.jpg":        {w:1139, h:1600},
  "op-deck-blackbeard.jpg":   {w:1139, h:1600},
  "op-deck-zoro.jpg":         {w:1139, h:1600},
  "op-deck-buggy.jpg":        {w:1139, h:1600},
};

/* Uma imagem da serie. Tal como no index: serve-se .webp a quem o suporta e
   cai-se no .jpg pelo onerror. Antes esta pagina puxava sempre o JPEG grande —
   o do Tokyo Revengers sao 316K contra 216K em WebP. */
function shotEl(caminho, titulo, i, total){
  const img = document.createElement('img');
  const d = PROJ_DIMS[caminho.split('/').pop()];
  if(d){ img.width = d.w; img.height = d.h; }
  const webp = caminho.replace(/\.jpe?g$/i, '.webp');
  let jpgTried = !WEBP_OK;
  img.onerror = () => { if(!jpgTried){ jpgTried = true; img.src = caminho; } };
  img.src = WEBP_OK ? webp : caminho;
  /* Numa serie o alt diz qual e: um leitor de ecra com quatro imagens todas
     chamadas "Tokyo Revengers" nao ajuda ninguem. */
  img.alt = total > 1
    ? `${titulo} · ${i + 1} ${LANG === 'pt' ? 'de' : 'of'} ${total}`
    : titulo;
  img.decoding = 'async';
  /* a primeira e a que se ve primeiro: essa nao e lazy. */
  if(i === 0){ img.fetchPriority = 'high'; } else { img.loading = 'lazy'; }
  return img;
}

const proj = CONFIG.projects.find(p => p.key === key);
const tp = proj ? t.projects[proj.key] : null;

if(!tp){
  document.getElementById('title').textContent = LANG === 'pt' ? 'Projeto não encontrado' : 'Project not found';
  document.getElementById('desc').textContent  = LANG === 'pt'
    ? 'Este endereço não corresponde a nenhum projeto. Volta ao portefólio.'
    : 'This address does not match any project. Head back to the portfolio.';
  document.getElementById('plate').remove();
  document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex,follow');
} else {
  document.title = `${tp.title} · Guita_Ink`;
  document.getElementById('kicker').textContent = tp.kicker;
  document.getElementById('title').textContent  = tp.title;
  document.getElementById('desc').textContent   = tp.desc;
  const plate = document.getElementById('plate');
  /* A capa mais o resto da serie, por ordem. Sem gallery fica so a capa e o
     resultado e o mesmo de sempre. */
  const serie = [proj.src, ...(proj.gallery || [])].filter(Boolean);
  if(serie.length){
    const caixa = document.createElement('div');
    caixa.className = 'shots';
    caixa.append(shotEl(serie[0], tp.title, 0, serie.length));
    if(serie.length > 1){
      const grelha = document.createElement('div');
      grelha.className = 'grelha';
      serie.slice(1).forEach((caminho, k) => {
        const a = document.createElement('a');
        a.href = caminho; a.target = '_blank'; a.rel = 'noopener';
        a.append(shotEl(caminho, tp.title, k + 1, serie.length));
        grelha.append(a);
      });
      caixa.append(grelha);
    }
    plate.replaceWith(caixa);
  } else {
    plate.querySelector('span').textContent = proj.plate || '';
    document.getElementById('note').textContent = LANG === 'pt'
      ? 'As imagens deste projeto ainda não estão publicadas.'
      : 'Artwork for this project is not published yet.';
  }
  /* SEO — overwrite the static per-page defaults with this project's own copy.
     Only reaches crawlers/unfurlers that execute JS (Google, Bing); others still
     get the generic fallback set in <head>, which beats no tags at all. */
  const pageUrl = `https://guitaink.com/projeto.html?p=${encodeURIComponent(proj.key)}`;
  /* com arte, partilha-se a arte do projecto; sem ela, o cartao geral em vez
     de uma ilustracao que nao e deste projecto. */
  const shareImg = proj.src
    ? `https://guitaink.com/${proj.src}`
    : 'https://guitaink.com/images/og-card.jpg';
  document.querySelector('meta[name="description"]').setAttribute('content', tp.desc);
  document.querySelector('meta[property="og:title"]').setAttribute('content', `${tp.title} · Guita_Ink`);
  document.querySelector('meta[property="og:description"]').setAttribute('content', tp.desc);
  document.querySelector('meta[property="og:url"]').setAttribute('content', pageUrl);
  document.querySelector('meta[property="og:image"]').setAttribute('content', shareImg);
  document.querySelector('link[rel="canonical"]').setAttribute('href', pageUrl);
}
/* o regresso ao portefolio leva a lingua consigo */
const casa = LANG === 'pt' ? 'index.html?lang=pt#projects' : 'index.html#projects';
document.querySelector('.back').href = casa;
document.getElementById('footBack').href = casa;
document.getElementById('backLabel').textContent = LANG === 'pt' ? 'Todo o trabalho' : 'All work';
document.getElementById('footBack').textContent  = LANG === 'pt' ? '← Voltar ao portefólio' : '← Back to portfolio';
document.getElementById('footL').textContent = `© ${new Date().getFullYear()} ${CONFIG.artistName} · ${CONFIG.realName}`;
</script>
</body>
</html>
