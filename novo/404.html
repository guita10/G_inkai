<style>
/* Esta pagina e propositadamente sozinha: o Netlify serve-a quando o endereco
   nao existe, em qualquer caminho, e nesse momento nao pode depender do
   site.css nem do site.js (um caminho relativo partia-se). Por isso traz os
   seus proprios tokens, os mesmos do site.css: se la mudares um, muda aqui.
   As letras e o selo vem por caminho absoluto (/fonts/..., /images/logo.svg);
   aberta do disco cai na letra do sistema e fica sem selo, e serve na mesma.
   Sempre no escuro: nao tem botao de tema. */
@font-face{font-family:'Shippori Mincho B1';font-weight:700;font-display:swap;
  src:url("/fonts/shippori-mincho-b1-700-latin.woff2") format("woff2")}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:400;font-display:swap;
  src:url("/fonts/zen-kaku-gothic-new-400-latin.woff2") format("woff2")}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:500;font-display:swap;
  src:url("/fonts/zen-kaku-gothic-new-500-latin.woff2") format("woff2")}
:root{
  color-scheme:dark;
  --void:#030407;         /* Midnight Black */
  --raise:#0E1015;        /* o passe-partout */
  --sky:#1558C9;          /* Electric Cobalt: o botao, com texto branco (6,42:1) */
  --bone:#EEF0F3;
  --bone-dim:#9BA0AA;     /* 7,81:1 sobre --void */
  --hi:#D8F454;           /* Acid Lime: o "404" (16,58:1) */
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--bone);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-size:1rem;line-height:1.6;
  min-height:100svh;display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr)}
/* as mesmas duas metades do site: a coluna que se le e o passe-partout */
main{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(24px,4.2vw,60px)}
aside{background:var(--raise);display:grid;place-items:center}
aside img{width:min(34%,220px);height:auto}
h1{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;font-weight:700;font-size:clamp(4rem,12vw,7rem);
  color:var(--hi);line-height:1}
p{color:var(--bone-dim);margin:14px 0 30px;max-width:30ch}
/* 2px e o raio dos botoes em todo o site; texto branco sobre o cobalto */
a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:#FFFFFF;background:var(--sky);
  border-radius:2px;padding:12px 20px;font-weight:500;line-height:20px;transition:transform .12s ease}
a:hover{background:#1B66E0}
a:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
a:active{transform:scale(.97)}
@media (max-width:1059px){
  body{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
}
@media (hover:none){a:hover{background:var(--sky)}}
@media (prefers-reduced-motion:reduce){
  a{transition:none}
  a:active{transform:none}
}
</style></head><body>
<main>
<h1>404</h1>
<!-- a pagina e bilingue: cada metade leva o seu lang, senao um leitor de ecra

<a href="/"><span lang="pt">Voltar ao início</span>&nbsp;/&nbsp;<span lang="en">Back home</span></a>
</main>
<!-- o selo, do lado do passe-partout; se nao carregar (pagina aberta do disco), sai -->
