/* Esta pagina e propositadamente sozinha: o Netlify serve-a quando o endereco
   nao existe, e nesse momento nao ha nada de que se possa depender. Por isso
   carrega os seus proprios tokens, em vez de os importar de lado nenhum.
   Sao os mesmos do index.html — se la mudares um, muda aqui.
   As letras vem da pasta fonts/ por caminho absoluto (/fonts/...): esta pagina
   e servida em qualquer endereco, e um caminho relativo partia-se. Aberta do
   disco, cai na letra do sistema, e serve na mesma. */
@font-face{font-family:'Shippori Mincho B1';font-weight:700;font-display:swap;
  src:url("/fonts/shippori-mincho-b1-700-latin.woff2") format("woff2")}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:400;font-display:swap;
  src:url("/fonts/zen-kaku-gothic-new-400-latin.woff2") format("woff2")}
@font-face{font-family:'Zen Kaku Gothic New';font-weight:500;font-display:swap;
  src:url("/fonts/zen-kaku-gothic-new-500-latin.woff2") format("woff2")}
/* Out 2026 (3): tinta sobre papel, o azul do selo como unica cor */
:root{
  --void:#F2F1EE;         /* o papel: o dia e o tema por omissao */
  --sky:#0E5CAB;          /* o azul do selo; texto por cima dele e o --void */
  --sky-lift:#0E5CAB;     /* 5,93:1 sobre --void */
  --bone:#141414;
  --bone-dim:#5C5B56;     /* 6,02:1 sobre --void */
}
/* a noite, so com o telemovel em modo escuro. Aqui sem JS: esta pagina nao
   tem botao de tema, por isso a preferencia do sistema chega. */
@media (prefers-color-scheme:dark){
  :root{
    --void:#121211;
    --sky:#8DB6F2;        /* 9,02:1 sobre --void */
    --sky-lift:#8DB6F2;
    --bone:#EDEBE6;
    --bone-dim:#9E9B94;   /* 6,76:1 sobre --void */
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--bone);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
 min-height:100dvh;display:grid;place-items:center;text-align:center;padding:30px}
h1{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;font-weight:700;font-size:clamp(3rem,14vw,7rem);
 color:var(--sky-lift);line-height:1}
p{color:var(--bone-dim);margin:14px 0 30px;font-size:1rem}
/* 2px e o raio dos botoes em todo o site. A borda nasce transparente para que
   o hover nao empurre o texto 1px.
   Antes o hover era um box-shadow inset a fazer de borda. Funcionava, mas o
   sistema desenha linhas e nao tem sombra nenhuma fora de um @keyframes — uma
   borda a serio diz o mesmo sem abrir a excepcao. */
a{display:inline-block;text-decoration:none;color:var(--void);background:var(--sky);
 border:1px solid var(--sky);border-radius:2px;padding:13px 28px;font-size:.875rem;font-weight:500;
 min-height:44px;                      /* o minimo de alvo de toque, como no .btn */
 transition:background .2s ease,border-color .2s ease,transform .12s ease}
/* no hover passa a tinta, como os botoes cheios do site: nunca fica oco */
a:hover{background:var(--bone);color:var(--void);border-color:var(--bone)}
a:focus-visible{outline:2px solid var(--sky-lift);outline-offset:3px}
/* Todo o controlo do site responde ao toque com um scale(.97) em 120ms. */
a:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){
  a{transition:none}
  a:active{transform:none}
}
